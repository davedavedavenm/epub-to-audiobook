name: Build webapp image

on:
  push:
    branches: [master]
    paths:
      - 'webapp/**'
      - 'scripts/convert_book.py'
      - '.github/workflows/build-webapp.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-webapp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push webapp
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./webapp/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/epub-to-audiobook-webapp:latest
          platforms: linux/amd64
          build-args: |
            APP_VERSION=ci
            APP_GIT_SHA=${{ github.sha }}
            APP_BUILD_TIME=${{ github.event.head_commit.timestamp }}
