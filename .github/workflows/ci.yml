name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: webapp/requirements.txt

      - name: Install deps
        run: |
          pip install -q flask requests gunicorn num2words nltk ebooklib \
            beautifulsoup4 lxml boto3 kaggle pytest

      - name: Run tests
        run: python -m pytest tests/ -x -q
        env:
          PYTHONPATH: webapp

  compose-config:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose
        run: docker compose config --quiet
