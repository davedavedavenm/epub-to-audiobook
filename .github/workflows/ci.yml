name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            webapp/requirements.txt
            gemini/requirements.txt
            tts_proxy/requirements.txt

      - name: Install deps
        run: |
          pip install -q flask requests gunicorn num2words nltk ebooklib \
            beautifulsoup4 lxml boto3 kaggle pytest mutagen edge-tts
          pip install -q -r gemini/requirements.txt

      - name: Lint
        run: |
          # PINNED: an unpinned ruff made CI red on every push when releases
          # added rules to files the repo's ratchet (ruff.toml) had frozen.
          # Bump deliberately, not silently.
          pip install -q "ruff==0.16.0"
          ruff check webapp/ tests/ scripts/ tts_proxy/ chatterbox/ tada/ vibevoice/ qwen3/ pocket/ kitten/

      - name: Run tests
        run: python -m pytest tests/ -x -q
        env:
          PYTHONPATH: webapp

  compose-config:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Validate docker-compose
        run: docker compose config --quiet
