<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Audiobook Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Outfit:wght@100..900&display=swap" rel="stylesheet">
<style>
:root {
    --bg-primary: #fdfcf9; --bg-card: #ffffff; --bg-sidebar: #1a1a1a; --bg-element: #f5f3ef; --bg-hover: #ece9e2;
    --accent: #c28e5e; --accent-hover: #a67246; --text-primary: #1a1a1a; --text-secondary: #6b665f; --text-on-dark: #fdfcf9;
    --border: #e8e4de; --radius-lg: 24px; --sidebar-width: 280px;
}
[data-theme="dark"] {
    --bg-primary: #0f0f0f; --bg-card: #1a1a1a; --bg-sidebar: #080808; --bg-element: #262626; --bg-hover: #333333;
    --text-primary: #f5f5f5; --text-secondary: #a3a3a3; --border: #262626;
}
* { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
body { font-family: 'Outfit', sans-serif; background: var(--bg-primary); color: var(--text-primary); margin: 0; display: flex; height: 100vh; overflow: hidden; transition: background 0.3s; }

.tab-panel { display: none; width: 100%; }
.tab-panel.active { display: block !important; }

.sidebar { width: var(--sidebar-width); background: var(--bg-sidebar); color: var(--text-on-dark); padding: 48px 24px; display: flex; flex-direction: column; flex-shrink: 0; position: fixed; left: 0; top: 0; bottom: 0; z-index: 1000; }
.sidebar-brand { margin-bottom: 64px; padding-left: 12px; font-family: 'Lora', serif; font-size: 2rem; font-weight: 700; }
.nav-links { display: flex; flex-direction: column; gap: 8px; flex: 1; }
.nav-tab { background: transparent; border: none; color: rgba(255,255,255,0.4); padding: 14px 20px; border-radius: 12px; cursor: pointer; display: flex; align-items: center; gap: 16px; font-size: 1rem; transition: all 0.2s; text-align: left; width: 100%; }
.nav-tab:hover { background: rgba(255,255,255,0.05); color: #fff; }
.nav-tab.active { background: var(--accent); color: #fff; box-shadow: 0 8px 20px rgba(194, 142, 94, 0.25); }
.nav-tab i { font-style: normal; font-size: 1.2rem; }

.app-main { flex: 1; margin-left: var(--sidebar-width); display: flex; flex-direction: column; height: 100vh; overflow-y: auto; }
.top-bar { padding: 24px 48px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; background: var(--bg-primary); border-bottom: 1px solid var(--border); z-index: 100; backdrop-filter: blur(12px); opacity: 0.98; }
.page-title { font-family: 'Lora', serif; font-size: 2.2rem; font-weight: 700; margin: 0; }

.content-body { padding: 48px; max-width: 1200px; width: 100%; margin: 0 auto; }
.card { background: var(--bg-card); border-radius: var(--radius-lg); border: 1px solid var(--border); padding: 40px; margin-bottom: 40px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); }
.library-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 24px; }
.library-item { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 28px; transition: all 0.3s; display: flex; flex-direction: column; }
.library-item:hover { border-color: var(--accent); transform: translateY(-4px); box-shadow: 0 20px 40px -15px rgba(0,0,0,0.1); }
.library-item-title { font-family: 'Lora', serif; font-size: 1.3rem; font-weight: 700; margin-bottom: 8px; }

.btn { padding: 12px 24px; border-radius: 8px; font-weight: 600; cursor: pointer; border: 1px solid var(--border); background: var(--bg-element); color: var(--text-primary); transition: all 0.2s; display: inline-flex; align-items: center; gap: 8px; font-family: 'Outfit', sans-serif; }
.btn:hover { border-color: var(--accent); background: var(--bg-hover); }
.btn-primary { background: var(--text-primary); color: #fff; border: none; }
.btn-primary:hover { background: var(--accent); }

.gpu-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 10px; background: #444; }
.gpu-dot.active { background: #4a7c59; }

.theme-selector { display: flex; background: var(--bg-element); padding: 4px; border-radius: 40px; border: 1px solid var(--border); }
.theme-btn { width: 40px; height: 40px; border-radius: 50%; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; background: transparent; font-size: 1.2rem; transition: 0.2s; }
.theme-btn.active { background: var(--bg-card); color: var(--accent); }

.modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; z-index: 2000; }
.modal-content { background: var(--bg-card); width: 90%; max-width: 900px; max-height: 85vh; border-radius: var(--radius-lg); padding: 48px; position: relative; display: flex; flex-direction: column; box-shadow: 0 40px 80px -20px rgba(0,0,0,0.3); }
.modal-close { position: absolute; top: 24px; right: 24px; background: transparent; border: none; font-size: 1.8rem; cursor: pointer; color: var(--text-secondary); }
#preview-text { overflow-y: auto; flex: 1; margin-top: 24px; font-family: 'Lora', serif; font-size: 1.15rem; line-height: 1.7; white-space: pre-wrap; }

.hidden { display: none !important; }
</style></head><body>
<aside class="sidebar">
    <div class="sidebar-brand">Studio</div>
    <nav class="nav-links">
        <button class="nav-tab active" data-tab="library" onclick="switchTab('library')"><i>📚</i> <span>Library</span></button>
        <button class="nav-tab" data-tab="convert" onclick="switchTab('convert')"><i>📝</i> <span>Production</span></button>
        <button class="nav-tab" data-tab="queue" onclick="switchTab('queue')"><i>⏳</i> <span>Queue</span></button>
        <button class="nav-tab" data-tab="voices" onclick="switchTab('voices')"><i>🗣️</i> <span>Voices</span></button>
        <button class="nav-tab" data-tab="history" onclick="switchTab('history')"><i>📋</i> <span>Archive</span></button>
        <button class="nav-tab" data-tab="settings" onclick="switchTab('settings')"><i>⚙️</i> <span>Config</span></button>
    </nav>
    <div style="margin-top: auto; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.1);">
        <div style="display: flex; align-items: center;"><span id="gpu-state-dot" class="gpu-dot"></span> <span id="gpu-state-label" style="font-size: 0.85rem;">GPU Offline</span></div>
    </div>
</aside>
<main class="app-main">
    <header class="top-bar">
        <h1 class="page-title" id="view-title">Library</h1>
        <div class="theme-selector">
            <button class="theme-btn" id="btn-light" onclick="setTheme('light')">☀️</button>
            <button class="theme-btn" id="btn-dark" onclick="setTheme('dark')">🌙</button>
        </div>
    </header>
    <div class="content-body">
        <div class="tab-panel active" id="tab-library">
            <div class="card">
                <input type="text" id="library-search" class="input-control" style="width: 100%; padding: 16px; margin-bottom: 32px;" placeholder="Search your collection..." oninput="renderLibrary()">
                <div id="library-grid" class="library-grid"></div>
            </div>
        </div>
        <div class="tab-panel" id="tab-convert">
            <div class="card">
                <h2 style="font-family: 'Lora', serif; margin-top: 0;">New Production</h2>
                <div id="upload-area" style="border: 2px dashed var(--border); padding: 100px 40px; text-align: center; border-radius: 20px; cursor: pointer; margin: 40px 0;" onclick="document.getElementById('file-input').click()">
                    <div style="font-size: 5rem; margin-bottom: 24px;">📖</div>
                    <h3>Drop manuscript here or click to browse</h3>
                    <div id="file-name-display" style="margin-top: 20px; font-weight: 700; color: var(--accent);"></div>
                </div>
                <input type="file" id="file-input" class="hidden" onchange="handleFile(event)">
                <button type="submit" id="convert-btn" class="btn btn-primary" style="width: 100%; height: 72px; font-size: 1.2rem;" disabled onclick="startProduction()">Begin Production Pipeline</button>
            </div>
        </div>
        <div class="tab-panel" id="tab-queue"><div class="card" id="queue-content">No active production.</div></div>
        <div class="tab-panel" id="tab-voices"><div class="card" id="voices-grid">Narrator profiles loading...</div></div>
        <div class="tab-panel" id="tab-history"><div class="card" id="history-content">Archive is empty.</div></div>
        <div class="tab-panel" id="tab-settings"><div class="card">Infrastructure Configuration.</div></div>
    </div>
</main>
<div id="preview-modal" class="modal-overlay hidden">
    <div class="modal-content">
        <button class="modal-close" onclick="closePreview()">✕</button>
        <h2 style="font-family: 'Lora', serif; margin: 0;">Manuscript Preview</h2>
        <div id="preview-text"></div>
    </div>
</div>
<script>
    const voices = {{ voices | tojson }};
    let libraryBooks = [];
    let selectedFile = null;

    function switchTab(tabId) {
        document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
        
        const target = document.getElementById('tab-' + tabId);
        const nav = document.querySelector('.nav-tab[data-tab="' + tabId + '"]');
        
        if(target) target.classList.add('active');
        if(nav) nav.classList.add('active');
        
        document.getElementById('view-title').textContent = tabId.charAt(0).toUpperCase() + tabId.slice(1);
        localStorage.setItem('audiobook-tab', tabId);
        
        if(tabId === 'library') loadLibrary();
        if(tabId === 'history') loadHistory();
        if(tabId === 'queue') loadJobs();
    }

    function setTheme(theme) {
        if(theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
        else document.documentElement.removeAttribute('data-theme');
        localStorage.setItem('audiobook-theme', theme);
        document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('btn-' + theme)?.classList.add('active');
    }

    async function loadLibrary() {
        const resp = await fetch('/api/library');
        libraryBooks = await resp.json();
        renderLibrary();
    }

    function renderLibrary() {
        const grid = document.getElementById('library-grid');
        const query = document.getElementById('library-search').value.toLowerCase();
        const filtered = libraryBooks.filter(b => b.title.toLowerCase().includes(query));
        
        grid.innerHTML = filtered.map(b => `
            <div class="library-item">
                <div class="library-item-title">${escapeHtml(b.title)}</div>
                <div style="margin-top: auto; display: flex; gap: 12px;">
                    <button class="btn" style="flex: 1;" onclick="previewBook('${escapeHtml(b.path)}')">Preview</button>
                    <button class="btn btn-primary" style="flex: 1;" onclick="convertFromLibrary('${escapeHtml(b.path)}')">Produce</button>
                </div>
            </div>
        `).join('');
    }

    async function previewBook(path) {
        const modal = document.getElementById('preview-modal');
        const textEl = document.getElementById('preview-text');
        textEl.textContent = 'Scanning manuscript...';
        modal.classList.remove('hidden');
        try {
            const resp = await fetch('/api/library/preview', { 
                method: 'POST', 
                headers: { 'Content-Type': 'application/json' }, 
                body: JSON.stringify({ path }) 
            });
            const data = await resp.json();
            textEl.textContent = data.preview || data.error;
        } catch(e) { textEl.textContent = 'Error loading preview.'; }
    }

    function closePreview() { document.getElementById('preview-modal').classList.add('hidden'); }

    function handleFile(e) {
        if(e.target.files.length) {
            selectedFile = e.target.files[0];
            document.getElementById('file-name-display').textContent = selectedFile.name;
            document.getElementById('convert-btn').disabled = false;
        }
    }

    async function startProduction() {
        const formData = new FormData();
        formData.append('file', selectedFile);
        formData.append('voice', 'en-GB-RyanNeural');
        await fetch('/api/convert', { method: 'POST', body: formData });
        switchTab('queue');
    }

    async function convertFromLibrary(path) {
        await fetch('/api/library/convert', { 
            method: 'POST', 
            headers: {'Content-Type': 'application/json'}, 
            body: JSON.stringify({ path, voice: 'en-GB-RyanNeural' }) 
        });
        switchTab('queue');
    }

    async function loadHistory() {
        const resp = await fetch('/api/history');
        const jobs = await resp.json();
        document.getElementById('history-content').innerHTML = jobs.map(j => `
            <div class="library-item">
                <strong>${escapeHtml(j.book_name)}</strong>
                <button class="btn" onclick="window.location.href='/api/jobs/${j.id}/download'">Download</button>
            </div>
        `).join('') || 'Archive is empty.';
    }

    async function loadJobs() {
        const resp = await fetch('/api/jobs');
        const jobs = await resp.json();
        const active = jobs.filter(j => j.status === 'queued' || j.status.includes('converting'));
        document.getElementById('queue-content').innerHTML = active.map(j => `
            <div class="card"><strong>${escapeHtml(j.book_name)}</strong><br>Status: ${j.status}</div>
        `).join('') || 'No active production.';
    }

    function escapeHtml(str) { const div = document.createElement('div'); div.textContent = str; return div.innerHTML; }

    window.onload = () => {
        const theme = localStorage.getItem('audiobook-theme') || 'light';
        setTheme(theme);
        const tab = localStorage.getItem('audiobook-tab') || 'library';
        switchTab(tab);
    };
</script></body></html>
