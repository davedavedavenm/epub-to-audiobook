<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Audiobook Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Outfit:wght@100..900&display=swap" rel="stylesheet">
<style>
:root {
    --bg-primary: #efefec; --bg-card: #ffffff; --bg-sidebar: #1a1a1a; --bg-element: #e2e2df; --bg-hover: #d2d2cf;
    --accent: #c28e5e; --text-primary: #1a1a1a; --text-secondary: #5a5a57; --text-on-dark: #f8f8f5;
    --border: #dcdcd9; --radius-lg: 24px; --radius-md: 12px; --radius-sm: 8px;
    --success: #4a7c59; --error: #af4d4d; --accent-subtle: #fcf7f2;
}
[data-theme="dark"] {
    --bg-primary: #0a0a0a; --bg-card: #141414; --bg-sidebar: #050505; --bg-element: #1f1f1f; --bg-hover: #2a2a2a;
    --text-primary: #f0f0f0; --text-secondary: #a0a0a0; --border: #262626;
}
* { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
body { font-family: 'Outfit', sans-serif; background: var(--bg-primary); color: var(--text-primary); margin: 0; display: flex; height: 100vh; overflow: hidden; transition: 0.3s; }

.app-main { flex: 1; margin-left: 280px; height: 100vh; overflow-y: auto !important; display: flex; flex-direction: column; }
.content-body { padding: 64px; max-width: 1400px; width: 100%; margin: 0 auto; flex: 1; }

.sidebar { width: 280px; background: var(--bg-sidebar); color: var(--text-on-dark); padding: 48px 24px; display: flex; flex-direction: column; position: fixed; left: 0; top: 0; bottom: 0; z-index: 1000; }
.sidebar-brand { margin-bottom: 64px; font-family: 'Lora', serif; font-size: 2.2rem; font-weight: 700; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 24px; }
.nav-links { display: flex; flex-direction: column; gap: 8px; flex: 1; }
.nav-tab { background: transparent; border: none; color: rgba(255,255,255,0.4); padding: 16px 24px; border-radius: 12px; cursor: pointer; display: flex; align-items: center; gap: 16px; font-size: 1.1rem; text-align: left; transition: 0.2s; width: 100%; font-family: 'Outfit'; }
.nav-tab:hover { background: rgba(255,255,255,0.05); color: #fff; }
.nav-tab.active { background: var(--accent); color: #fff; box-shadow: 0 8px 20px rgba(194, 142, 94, 0.25); }

.top-bar { padding: 32px 64px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; background: var(--bg-primary); border-bottom: 1px solid var(--border); z-index: 100; backdrop-filter: blur(12px); opacity: 0.98; flex-shrink: 0; }
.page-title { font-family: 'Lora', serif; font-size: 2.5rem; font-weight: 700; margin: 0; }

.tab-panel { display: none !important; }
.tab-panel.active { display: block !important; animation: fadeIn 0.4s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

.card { background: var(--bg-card); border-radius: var(--radius-lg); border: 1px solid var(--border); padding: 48px; margin-bottom: 48px; box-shadow: 0 10px 30px -10px rgba(0,0,0,0.05); position: relative; }
.btn { padding: 14px 28px; border-radius: 12px; font-weight: 700; cursor: pointer; border: 1px solid var(--border); background: var(--bg-element); color: var(--text-primary); transition: 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 10px; font-family: 'Outfit'; font-size: 1rem; }
.btn:hover { border-color: var(--accent); background: var(--bg-hover); }
.btn-primary { background: #1a1a1a; color: #fff; border: 2px solid #1a1a1a; }
.btn-primary:hover { background: var(--accent); border-color: var(--accent); box-shadow: 0 8px 20px rgba(194, 142, 94, 0.3); }

.input-control { width: 100%; padding: 14px 18px; background: var(--bg-element); border: 1px solid var(--border); border-radius: 12px; color: var(--text-primary); font-family: 'Outfit'; font-size: 1rem; transition: 0.2s; }
.input-control:focus { border-color: var(--accent); outline: none; }

.library-grid { display: grid; grid-template-columns: 1fr; gap: 32px; }
.library-item { background: var(--bg-card); border: 1px solid var(--border); border-radius: 24px; padding: 40px; transition: 0.3s; display: flex; flex-direction: column; position: relative; overflow: hidden; }
.library-item:hover { border-color: var(--accent); box-shadow: 0 20px 50px -15px rgba(0,0,0,0.1); }
.library-item-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 32px; }
.library-item-title { font-family: 'Lora', serif; font-size: 1.8rem; font-weight: 700; line-height: 1.2; flex: 1; padding-right: 40px; }
.library-item-format { background: var(--accent); color: #fff; font-size: 0.75rem; font-weight: 900; padding: 4px 12px; border-radius: 20px; text-transform: uppercase; letter-spacing: 0.1em; }

.workspace-trigger { margin-top: auto; display: flex; gap: 16px; align-items: center; }
.production-workspace { display: none; margin-top: 40px; border-top: 2px solid var(--bg-element); padding-top: 40px; animation: slideUp 0.4s ease; }
.production-workspace.active { display: block; }
@keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

.setup-grid { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 24px; margin-bottom: 32px; align-items: flex-end; }
.setup-field { display: flex; flex-direction: column; gap: 10px; }
.setup-label { font-weight: 800; font-size: 0.75rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.05em; }

.engine-section { margin-bottom: 64px; }
.engine-header { font-family: 'Lora'; font-size: 1.8rem; font-weight: 700; margin-bottom: 32px; border-left: 6px solid var(--accent); padding-left: 20px; }
.voices-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 24px; }
.voice-card { background: var(--bg-element); border: 1px solid var(--border); border-radius: 16px; padding: 24px; display: flex; justify-content: space-between; align-items: center; transition: 0.2s; }
.voice-name { font-weight: 800; font-size: 1.2rem; }

.config-group { margin-bottom: 48px; padding-bottom: 48px; border-bottom: 1px solid var(--border); }
.config-group:last-child { border-bottom: none; }
.config-header { font-family: 'Lora'; font-size: 1.5rem; font-weight: 700; margin-bottom: 24px; display: flex; align-items: center; gap: 12px; }
.status-dot { width: 10px; height: 10px; border-radius: 50%; background: #ccc; }
.status-dot.active { background: var(--success); box-shadow: 0 0 8px var(--success); }

.progress-bar { width: 100%; height: 10px; background: var(--bg-element); border-radius: 10px; margin: 16px 0; overflow: hidden; }
.progress-fill { height: 100%; background: var(--accent); transition: width 0.5s ease; }

.job-detail-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 20px; margin-top: 20px; font-size: 0.85rem; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; }
.job-detail-item b { color: var(--text-primary); display: block; font-size: 1rem; text-transform: none; margin-top: 4px; }

.modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; z-index: 2000; }
.modal-content { background: var(--bg-card); width: 95%; max-width: 1200px; height: 90vh; border-radius: var(--radius-lg); padding: 0; position: relative; display: flex; overflow: hidden; border: 1px solid var(--border); }
.modal-close { position: absolute; top: 24px; right: 24px; background: transparent; border: none; font-size: 2rem; cursor: pointer; color: var(--text-secondary); z-index: 10; }

.preview-sidebar { width: 350px; background: var(--bg-element); border-right: 1px solid var(--border); padding: 48px 32px; overflow-y: auto; flex-shrink: 0; }
.preview-body { flex: 1; padding: 48px 64px; overflow-y: auto; position: relative; }
.preview-text { font-family: 'Lora', serif; font-size: 1.25rem; line-height: 1.8; white-space: pre-wrap; color: var(--text-primary); }
[data-theme='dark'] .preview-text { color: #f0f0f0; }

.toc-item { padding: 12px 16px; border-radius: 8px; cursor: pointer; font-size: 0.95rem; font-weight: 600; transition: 0.2s; border: 1px solid transparent; }
.toc-item:hover { background: var(--bg-hover); }
.toc-item.active { background: var(--accent); color: #fff; border-color: var(--accent); }

.hidden { display: none !important; }
.gpu-dot { width: 10px; height: 10px; border-radius: 50%; background: #444; }
.gpu-dot.active { background: #4a7c59; box-shadow: 0 0 10px #4a7c59; }
</style>
</style></head><body>
<aside class="sidebar">
    <div class="sidebar-brand">Studio</div>
    <nav class="nav-links">
        <button class="nav-tab active" data-tab="library" onclick="switchTab('library')"><i>📚</i> <span>Library</span></button>
        <button class="nav-tab" data-tab="convert" onclick="switchTab('convert')"><i>📝</i> <span>Upload</span></button>
        <button class="nav-tab" data-tab="queue" onclick="switchTab('queue')"><i>⏳</i> <span>Queue</span></button>
        <button class="nav-tab" data-tab="voices" onclick="switchTab('voices')"><i>🗣️</i> <span>Voices</span></button>
        <button class="nav-tab" data-tab="history" onclick="switchTab('history')"><i>📋</i> <span>History</span></button>
        <button class="nav-tab" data-tab="settings" onclick="switchTab('settings')"><i>⚙️</i> <span>Config</span></button>
    </nav>
    <div style="margin-top: auto; padding-top: 24px; border-top: 1px solid rgba(255,255,255,0.1);">
        <div style="display: flex; align-items: center;"><span id="gpu-state-dot" class="gpu-dot"></span> <span id="gpu-state-label" style="font-size: 0.9rem; font-weight: 600;">GPU OFFLINE</span></div>
    </div>
</aside>
<main class="app-main">
    <header class="top-bar">
        <h1 class="page-title" id="view-title">Library</h1>
        <div class="theme-selector">
            <button class="theme-btn" id="btn-light" onclick="setTheme('light')">☀️</button>
            <button class="theme-btn" id="btn-dark" onclick="setTheme('dark')">🌙</button>
        </div>
    </header>
    <div class="content-body">
        <div class="tab-panel active" id="tab-library">
            <div class="card">
                <input type="text" id="library-search" class="input-control" style="width: 100%; padding: 20px; margin-bottom: 40px; font-size: 1.1rem; border-radius: 16px; border: 2px solid var(--border);"
                       placeholder="Search your collection..." oninput="renderLibrary()">
                <div id="library-grid" class="library-grid"></div>
            </div>
        </div>
        
        <div class="tab-panel" id="tab-convert">
            <div class="card">
                <h2 style="font-family: 'Lora', serif; font-size: 2.2rem; margin-top: 0;">New Production</h2>
                <div id="upload-area" style="border: 2px dashed var(--border); padding: 100px 40px; text-align: center; border-radius: 32px; cursor: pointer; background: var(--bg-element); margin: 40px 0;" onclick="document.getElementById('file-input').click()">
                    <div style="font-size: 5rem; margin-bottom: 24px;">📖</div>
                    <h3>Drop manuscript here</h3>
                    <div id="file-name-display" style="margin-top: 24px; font-weight: 700; color: var(--accent);"></div>
                </div>
                <input type="file" id="file-input" class="hidden" onchange="handleFile(event)">
                <button id="convert-btn" class="btn btn-primary" style="width: 100%; height: 88px; font-size: 1.4rem;" disabled onclick="startProduction()">Initialize Production</button>
            </div>
        </div>

        <div class="tab-panel" id="tab-queue"><div id="queue-content"></div></div>
        
        <div class="tab-panel" id="tab-voices"><div id="voices-content"></div></div>
        
        <div class="tab-panel" id="tab-history"><div id="history-content"></div></div>

        <div class="tab-panel" id="tab-settings">
            <div class="card">
                <h2 style="margin-top:0; font-family: 'Lora'; margin-bottom:48px;">Infrastructure Configuration</h2>
                
                <div class="config-group">
                    <div class="config-header">📂 Audiobookshelf <span id="status-abs" class="status-dot"></span></div>
                    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:24px; margin-top:20px;">
                        <div><label style="font-weight:800; font-size:0.75rem;">URL</label><input type="text" id="set-ABS_API_URL" class="input-control"></div>
                        <div><label style="font-weight:800; font-size:0.75rem;">TOKEN</label><input type="password" id="set-ABS_API_TOKEN" class="input-control"></div>
                    </div>
                    <button class="btn" style="margin-top:20px;" onclick="testConnection('abs')">Test Connection</button>
                </div>

                <div class="config-group">
                    <div class="config-header">☁️ OpenAI <span id="status-openai" class="status-dot"></span></div>
                    <div style="display:grid; grid-template-columns: 1fr; gap:24px; margin-top:20px;">
                        <div><label style="font-weight:800; font-size:0.75rem;">API KEY</label><input type="password" id="set-OPENAI_API_KEY" class="input-control"></div>
                    </div>
                    <button class="btn" style="margin-top:20px;" onclick="testConnection('openai')">Test API Key</button>
                </div>

                <div style="border-top: 1px solid var(--border); padding-top:40px; display:flex; justify-content:flex-end;">
                    <button id="save-config-btn" class="btn btn-primary" style="width:300px; height:70px;" onclick="saveSettings()">Save Configuration</button>
                </div>
            </div>
        </div>
    </div>
</main>

<!-- Robust Preview Modal -->
<div id="preview-modal" class="modal-overlay hidden">
    <div class="modal-content">
        <div class="preview-sidebar">
            <h3 style="font-family: 'Lora'; margin-top: 0; margin-bottom: 32px;">Contents</h3>
            <div id="toc-list" style="display: flex; flex-direction: column; gap: 8px;"></div>
        </div>
        <div class="preview-body">
            <button class="modal-close" onclick="closePreview()">&#10005;</button>
            <h2 id="preview-modal-title" style="font-family: 'Lora', serif; font-size: 1.8rem; margin: 0;">Page Preview</h2>
            <div id="preview-text-container" style="margin-top: 40px;">
                <div id="preview-text" class="preview-text"></div>
            </div>
        </div>
    </div>
</div>
<audio id="preview-audio"></audio>
<script>
    const voices = {{ voices | tojson }};
    let libraryBooks = [];
    let selectedFile = null;
    let currentPreviewPath = null;

    function switchTab(tabId) {
        console.log('Tab:', tabId);
        document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
        const target = document.getElementById('tab-' + (tabId === 'convert' ? 'convert' : (tabId === 'settings' ? 'settings' : tabId)));
        const nav = document.querySelector('.nav-tab[data-tab="' + tabId + '"]');
        if(target) target.classList.add('active');
        if(nav) nav.classList.add('active');
        const titleEl = document.getElementById('view-title');
        if(titleEl) titleEl.textContent = tabId.charAt(0).toUpperCase() + tabId.slice(1);
        localStorage.setItem('audiobook-tab', tabId);
        if(tabId === 'library') loadLibrary();
        if(tabId === 'history') loadHistory();
        if(tabId === 'voices') renderVoices();
        if(tabId === 'queue') loadJobs();
        if(tabId === 'settings') loadSettings();
    }

    function setTheme(theme) {
        if(theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
        else document.documentElement.removeAttribute('data-theme');
        localStorage.setItem('audiobook-theme', theme);
        document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
        const btn = document.getElementById('btn-' + theme);
        if(btn) btn.classList.add('active');
    }

    async function loadSettings() {
        const resp = await fetch('/api/settings');
        const data = await resp.json();
        Object.entries(data).forEach(([key, val]) => {
            const el = document.getElementById('set-' + key);
            if(el) el.value = val;
        });
    }

    async function saveSettings() {
        const btn = document.getElementById('save-config-btn');
        btn.textContent = 'Saving...'; btn.disabled = true;
        const settings = {};
        document.querySelectorAll('[id^="set-"]').forEach(el => {
            const key = el.id.replace('set-', '');
            if(el.value && !el.value.includes('...')) settings[key] = el.value;
        });
        try {
            await fetch('/api/settings', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(settings)
            });
            btn.textContent = 'Saved!';
            btn.style.backgroundColor = 'var(--success)';
            setTimeout(() => { btn.textContent = 'Save Configuration'; btn.style.backgroundColor = ''; btn.disabled = false; }, 2000);
        } catch(e) { btn.textContent = 'Error'; btn.disabled = false; }
    }

    async function testConnection(type) {
        let endpoint = '/api/settings/test_' + type;
        let payload = {};
        if(type === 'abs') {
            payload = { url: document.getElementById('set-ABS_API_URL').value, token: document.getElementById('set-ABS_API_TOKEN').value };
        } else {
            payload = { token: document.getElementById('set-OPENAI_API_KEY').value };
        }
        const resp = await fetch(endpoint, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) });
        const data = await resp.json();
        alert(data.message || data.error);
        if(data.status === 'success') document.getElementById('status-' + type).classList.add('active');
    }

    async function loadLibrary() {
        const resp = await fetch('/api/library');
        libraryBooks = await resp.json();
        renderLibrary();
    }

    function renderLibrary() {
        const grid = document.getElementById('library-grid');
        const query = (document.getElementById('library-search')?.value || '').toLowerCase();
        const filtered = libraryBooks.filter(b => b.title.toLowerCase().includes(query));
        
        const engines = [...new Set(Object.values(voices).map(v => v.engine))];
        const voiceOptions = engines.map(engine => {
            const engineVoices = Object.entries(voices).filter(([id, v]) => v.engine === engine);
            return `<optgroup label="${engine.toUpperCase()} ENGINE">${engineVoices.map(([id, v]) => `<option value="${id}">${v.name} (${v.accent})</option>`).join('')}</optgroup>`;
        }).join('');

        grid.innerHTML = filtered.map(b => {
            const bookId = btoa(b.path).replace(/[^a-z0-9]/gi, '');
            return `
                <div class="library-item">
                    <div class="library-item-header">
                        <div class="library-item-title">${escapeHtml(b.title)}</div>
                        <div class="library-item-format">${b.format}</div>
                    </div>
                    
                    <div class="workspace-trigger">
                        <button class="btn" onclick="previewBook('${escapeHtml(b.path).replace(/'/g, "\\'")}')">👁 Preview</button>
                        <button class="btn btn-primary" style="flex:1;" onclick="document.getElementById('workspace-${bookId}').classList.toggle('active')">Setup Production</button>
                    </div>

                    <div id="workspace-${bookId}" class="production-workspace">
                        <div class="setup-grid">
                            <div class="setup-field"><label class="setup-label">Narrator</label><select id="voice-${bookId}" class="input-control">${voiceOptions}</select></div>
                            <div class="setup-field"><label class="setup-label">Start</label><input id="start-${bookId}" type="number" class="input-control"></div>
                            <div class="setup-field"><label class="setup-label">End</label><input id="end-${bookId}" type="number" class="input-control"></div>
                            <div class="setup-field"><label class="setup-label">Speed</label><input id="speed-${bookId}" type="number" step="0.1" value="1.0" class="input-control"></div>
                        </div>
                        <button class="btn btn-primary" style="width: 100%; height: 64px;" onclick="convertWithSettings('${bookId}', '${escapeHtml(b.path).replace(/'/g, "\\'")}')">Initialize Pipeline</button>
                    </div>
                </div>
            `;
        }).join('');
    }

    function renderVoices() {
        const container = document.getElementById('voices-content');
        if(!container) return;
        const engines = [...new Set(Object.values(voices).map(v => v.engine))];
        container.innerHTML = engines.map(engine => {
            const engineVoices = Object.entries(voices).filter(([id, v]) => v.engine === engine);
            return `<div class="engine-section"><div class="engine-header">${engine.toUpperCase()} ENGINE</div><div class="voices-grid">${engineVoices.map(([id, v]) => `<div class="voice-card"><div><div class="voice-name">${escapeHtml(v.name)}</div><div style="font-size:0.85rem; color:var(--text-secondary);">${v.accent} · ${v.gender}</div></div><button class="btn" onclick="playPreview('${id}')">▶</button></div>`).join('')}</div></div>`;
        }).join('');
    }

    function playPreview(voiceId) {
        const audio = document.getElementById('preview-audio');
        audio.src = '/api/preview/' + voiceId; 
        audio.load(); audio.play().catch(e => console.error(e));
    }

    async function previewBook(path, chapterIndex = null) {
        const modal = document.getElementById('preview-modal');
        const textEl = document.getElementById('preview-text');
        const tocList = document.getElementById('toc-list');
        
        if (!chapterIndex) {
            currentPreviewPath = path;
            textEl.textContent = 'Scanning manuscript...';
            tocList.innerHTML = '';
            modal.classList.remove('hidden');
        } else {
            textEl.textContent = 'Loading chapter...';
        }

        try {
            const resp = await fetch('/api/library/preview', { 
                method: 'POST', 
                headers: {'Content-Type': 'application/json'}, 
                body: JSON.stringify({ path, chapter_index: chapterIndex }) 
            });
            const data = await resp.json();
            textEl.textContent = data.preview || data.error;

            if (data.chapters && !chapterIndex) {
                tocList.innerHTML = data.chapters.map(c => `
                    <div class="toc-item ${c.index === 1 ? 'active' : ''}" onclick="loadPreviewChapter(${c.index}, this)">
                        ${c.index}. ${escapeHtml(c.title)}
                    </div>
                `).join('');
            }
        } catch(e) { textEl.textContent = 'Error loading preview.'; }
    }

    async function loadPreviewChapter(index, el) {
        document.querySelectorAll('.toc-item').forEach(i => i.classList.remove('active'));
        el.classList.add('active');
        await previewBook(currentPreviewPath, index);
    }

    function closePreview() { document.getElementById('preview-modal').classList.add('hidden'); }

    function handleFile(e) {
        if(e.target.files.length) {
            selectedFile = e.target.files[0];
            document.getElementById('file-name-display').textContent = selectedFile.name;
            document.getElementById('convert-btn').disabled = false;
        }
    }

    async function startProduction() {
        const formData = new FormData();
        formData.append('file', selectedFile); formData.append('voice', 'en-GB-RyanNeural');
        await fetch('/api/convert', { method: 'POST', body: formData });
        switchTab('queue');
    }

    async function convertWithSettings(bookId, path) {
        const voice = document.getElementById('voice-' + bookId).value;
        const start = document.getElementById('start-' + bookId).value;
        const end = document.getElementById('end-' + bookId).value;
        const speed = document.getElementById('speed-' + bookId).value;
        await fetch('/api/library/convert', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ path, voice, start_chapter: start, end_chapter: end, tts_speed: speed }) });
        switchTab('queue');
    }

    async function loadJobs() {
        const resp = await fetch('/api/jobs');
        const jobs = await resp.json();
        const active = jobs.filter(j => j.status === 'queued' || j.status.includes('converting'));
        const queueContent = document.getElementById('queue-content');
        if(queueContent && active.length > 0) {
            queueContent.innerHTML = active.map(j => `
                <div class="card">
                    <div style="display:flex; justify-content:space-between; margin-bottom:24px;">
                        <div><div style="text-transform:uppercase; font-size:0.75rem; font-weight:900; color:var(--accent);">${j.status}</div><div class="library-item-title">${escapeHtml(j.book_name)}</div></div>
                        <div style="text-align:right;"><div style="font-size:1.5rem; font-weight:800;">${j.progress_percent}%</div><div style="font-size:0.7rem; color:var(--text-secondary);">ETA: ${j.eta_minutes || '?'}m</div></div>
                    </div>
                    <div class="progress-bar"><div class="progress-fill" style="width: ${j.progress_percent}%"></div></div>
                    <div class="job-detail-row">
                        <div class="job-detail-item">Narrator <b>${j.voice_name || j.voice}</b></div>
                        <div class="job-detail-item">Engine <b>${j.tts_engine.toUpperCase()}</b></div>
                        <div class="job-detail-item">Speed <b>${j.tts_speed || '1.0'}x</b></div>
                        <div class="job-detail-item">Range <b>${j.start_chapter || 1} - ${j.end_chapter || 'End'}</b></div>
                    </div>
                </div>
            `).join('');
        } else if(queueContent) {
            queueContent.innerHTML = '<div class="card" style="text-align:center; padding:100px;">Production queue is clear.</div>';
        }
    }

    async function loadHistory() {
        const resp = await fetch('/api/history');
        const jobs = await resp.json();
        document.getElementById('history-content').innerHTML = jobs.map(j => `<div class="card" style="display:flex; justify-content:space-between; align-items:center;"><div><div style="font-family:'Lora'; font-size:1.2rem; font-weight:700;">✅ ${escapeHtml(j.book_name)}</div></div><button class="btn" onclick="window.location.href='/api/jobs/${j.id}/download'">Download</button></div>`).join('') || '<div class="card">History is empty.</div>';
    }

    async function loadGpuStatus() {
        try {
            const resp = await fetch('/api/gpu/status');
            const gpu = await resp.json();
            const label = document.getElementById('gpu-state-label');
            if(label) label.textContent = (gpu.state || 'OFFLINE').toUpperCase();
            const dot = document.getElementById('gpu-state-dot');
            if(dot) dot.className = 'gpu-dot ' + (gpu.state || 'idle');
        } catch(e) {}
    }

    function escapeHtml(str) { if(!str) return ''; const div = document.createElement('div'); div.textContent = str; return div.innerHTML; }

    window.onload = () => {
        const theme = localStorage.getItem('audiobook-theme') || 'light'; setTheme(theme);
        const tab = localStorage.getItem('audiobook-tab') || 'library'; switchTab(tab);
        setInterval(loadJobs, 5000); setInterval(loadGpuStatus, 10000);
    };
</script></body></html>
