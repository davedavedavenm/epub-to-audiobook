<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Audiobook Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@700&family=Outfit:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #f8f7f4; --bg-card: #ffffff; --bg-sidebar: #121212; --bg-element: #f1efeb; --bg-hover: #e8e5e0;
            --accent: #c28e5e; --text-primary: #1a1a1a; --text-secondary: #6b665f; --text-on-dark: #fdfcf9;
            --border: #e8e4de; --success: #4a7c59; --error: #af4d4d; --warning: #d4a373;
            --font-display: 'Lora', serif; --font-ui: 'Outfit', sans-serif;
            --sidebar-width: 280px; --radius-lg: 24px; --radius-md: 12px; --radius-sm: 8px;
        }
        [data-theme="dark"] {
            --bg-primary: #0a0a0a; --bg-card: #141414; --bg-sidebar: #050505; --bg-element: #1f1f1f; --bg-hover: #2a2a2a;
            --text-primary: #f0f0f0; --text-secondary: #a0a0a0; --border: #262626;
        }
        * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
        body { font-family: var(--font-ui); background: var(--bg-primary); color: var(--text-primary); margin: 0; display: flex; height: 100vh; overflow: hidden; transition: background 0.3s; }

        .tab-panel { display: none; width: 100%; }
        .tab-panel.active { display: block !important; }

        .sidebar { width: var(--sidebar-width); background: var(--bg-sidebar); color: var(--text-on-dark); padding: 48px 24px; display: flex; flex-direction: column; position: fixed; left: 0; top: 0; bottom: 0; z-index: 1000; }
        .sidebar-brand { margin-bottom: 64px; font-family: var(--font-display); font-size: 2rem; font-weight: 700; }
        .nav-links { display: flex; flex-direction: column; gap: 12px; flex: 1; }
        .nav-tab { background: transparent; border: none; color: rgba(255,255,255,0.4); padding: 14px 20px; border-radius: var(--radius-md); cursor: pointer; display: flex; align-items: center; gap: 16px; font-size: 1.05rem; text-align: left; transition: 0.2s; width: 100%; font-family: var(--font-ui); }
        .nav-tab:hover { background: rgba(255,255,255,0.05); color: #fff; }
        .nav-tab.active { background: var(--accent); color: #fff; box-shadow: 0 8px 20px rgba(194, 142, 94, 0.25); }
        .nav-tab i { font-style: normal; }

        .app-main { flex: 1; margin-left: var(--sidebar-width); display: flex; flex-direction: column; height: 100vh; overflow-y: auto; }
        .top-bar { padding: 24px 48px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; background: var(--bg-primary); border-bottom: 1px solid var(--border); z-index: 100; backdrop-filter: blur(12px); }
        .page-title { font-family: var(--font-display); font-size: 2.2rem; font-weight: 700; margin: 0; }
        .theme-selector { display: flex; background: var(--bg-element); padding: 4px; border-radius: 40px; border: 1px solid var(--border); }
        .theme-btn { width: 40px; height: 40px; border-radius: 50%; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; background: transparent; font-size: 1.3rem; transition: 0.2s; }
        .theme-btn.active { background: var(--bg-card); color: var(--accent); }

        .content-body { padding: 48px; max-width: 1300px; width: 100%; margin: 0 auto; }
        .card { background: var(--bg-card); border-radius: var(--radius-lg); border: 1px solid var(--border); padding: 40px; margin-bottom: 40px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); }
        .library-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 24px; }
        .library-item { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 28px; transition: 0.3s; display: flex; flex-direction: column; }
        .library-item:hover { border-color: var(--accent); transform: translateY(-4px); box-shadow: 0 20px 40px -15px rgba(0,0,0,0.1); }
        .library-item-title { font-family: var(--font-display); font-size: 1.3rem; font-weight: 700; margin-bottom: 8px; }
        .library-item-meta { font-size: 0.9rem; color: var(--text-secondary); margin-bottom: 24px; }

        .input-control, .btn { padding: 14px 18px; background: var(--bg-element); border: 1px solid var(--border); border-radius: var(--radius-md); color: var(--text-primary); font-family: var(--font-ui); font-size: 1rem; }
        .btn { font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s; }
        .btn-primary { background: var(--text-primary); color: #fff; border: none; }
        .btn-primary:hover { background: var(--accent); }

        .gpu-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 10px; background: #444; }
        .gpu-dot.active { background: var(--success); box-shadow: 0 0 10px var(--success); }

        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; z-index: 2000; }
        .modal-content { background: var(--bg-card); width: 90%; max-width: 900px; max-height: 85vh; border-radius: var(--radius-lg); padding: 48px; position: relative; display: flex; flex-direction: column; box-shadow: 0 40px 80px -20px rgba(0,0,0,0.3); }
        .modal-close { position: absolute; top: 24px; right: 24px; background: transparent; border: none; font-size: 1.8rem; cursor: pointer; color: var(--text-secondary); }
        #preview-content { overflow-y: auto; flex: 1; margin-top: 24px; font-family: var(--font-display); font-size: 1.15rem; line-height: 1.7; white-space: pre-wrap; }

        .hidden { display: none !important; }
        .spinner { width: 40px; height: 40px; border: 4px solid var(--accent-subtle); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; margin: 40px auto; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-brand"><span class="logo-text">Studio</span></div>
        <nav class="nav-links">
            <button class="nav-tab" data-tab="library" onclick="switchTab('library')"><i>\uD83D\uDCDA</i> <span>Library</span></button>
            <button class="nav-tab" data-tab="convert" onclick="switchTab('convert')"><i>\uD83D\uDCDD</i> <span>Production</span></button>
            <button class="nav-tab" data-tab="queue" onclick="switchTab('queue')"><i>\u23F3</i> <span>Queue</span> <span class="badge hidden" id="queue-badge">0</span></button>
            <button class="nav-tab" data-tab="voices" onclick="switchTab('voices')"><i>\uD83D\uDDE3</i> <span>Voices</span></button>
            <button class="nav-tab" data-tab="history" onclick="switchTab('history')"><i>\uD83D\uDCCB</i> <span>Archive</span></button>
            <button class="nav-tab" data-tab="settings" onclick="switchTab('settings')"><i>\u2699</i> <span>Config</span></button>
        </nav>
        <div class="sidebar-footer">
            <div style="display: flex; align-items: center;"><span id="gpu-state-dot" class="gpu-dot"></span> <span id="gpu-state-label" style="font-size: 0.85rem; font-weight: 600;">GPU Offline</span></div>
        </div>
    </aside>
    <main class="app-main">
        <header class="top-bar">
            <h1 class="page-title" id="view-title">Library</h1>
            <div class="theme-selector">
                <button class="theme-btn" id="btn-light" onclick="setTheme('light')">\u2600</button>
                <button class="theme-btn" id="btn-dark" onclick="setTheme('dark')">\uD83C\uDF19</button>
            </div>
        </header>
        <div class="content-body">
            <div class="tab-panel" id="tab-library">
                <div class="card">
                    <div style="display: flex; gap: 24px; margin-bottom: 40px; align-items: center;">
                        <input type="text" id="library-search" class="input-control" style="flex: 1;" placeholder="Search your collection...">
                        <select id="library-voice-select" class="input-control" style="width: auto;">
                            <option value="en-GB-RyanNeural">Narrator: Ryan (British)</option>
                            {% for id, v in voices.items() %}<option value="{{ id }}">{{ v.name }} ({{ v.accent }})</option>{% endfor %}
                        </select>
                    </div>
                    <div id="library-grid" class="library-grid"></div>
                </div>
            </div>
            <div class="tab-panel" id="tab-convert">
                <div class="card">
                    <form id="convert-form">
                        <div id="upload-area" style="border: 2px dashed var(--border); padding: 100px 40px; text-align: center; border-radius: var(--radius-lg); cursor: pointer;">
                            <div style="font-size: 5rem; margin-bottom: 24px;">\uD83D\uDCD6</div>
                            <h2>Drop manuscript here</h2>
                            <div id="file-name" class="hidden" style="font-weight: 700; color: var(--accent); margin-top: 20px;"></div>
                        </div>
                        <input type="file" id="file-input" class="hidden">
                        <button type="submit" id="convert-btn" class="btn btn-primary" style="margin-top: 48px; height: 72px; width: 100%;" disabled>Begin Production</button>
                    </form>
                </div>
            </div>
            <div class="tab-panel" id="tab-queue"><div class="card"><div id="queue-content"></div></div></div>
            <div class="tab-panel" id="tab-voices"><div class="card">Voices Explorer Content</div></div>
            <div class="tab-panel" id="tab-history"><div class="card"><div id="history-content"></div></div></div>
            <div class="tab-panel" id="tab-settings"><div class="card">Settings Panel Content</div></div>
        </div>
    </main>
    <div id="preview-modal" class="modal-overlay hidden"><div class="modal-content"><button class="modal-close" onclick="closePreview()">\u2715</button><div id="preview-content"></div></div></div>

    <script>
        const voices = {{ voices | tojson }};
        let libraryBooks = [];

        function switchTab(tabId) {
            console.log('Switching to', tabId);
            document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
            
            const target = document.getElementById('tab-' + tabId);
            const nav = document.querySelector('.nav-tab[data-tab="' + tabId + '"]');
            
            if(target) target.classList.add('active');
            if(nav) nav.classList.add('active');
            
            const titleEl = document.getElementById('view-title');
            if(titleEl) titleEl.textContent = tabId.charAt(0).toUpperCase() + tabId.slice(1);
            
            localStorage.setItem('audiobook-tab', tabId);
            
            if(tabId === 'library') loadLibrary();
            if(tabId === 'history') loadHistory();
            if(tabId === 'queue') loadJobs();
        }

        function setTheme(theme) {
            if(theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
            else document.documentElement.removeAttribute('data-theme');
            localStorage.setItem('audiobook-theme', theme);
            document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + theme)?.classList.add('active');
        }

        async function loadLibrary() {
            try {
                const resp = await fetch('/api/library');
                libraryBooks = await resp.json();
                renderLibrary();
            } catch(e) {}
        }

        function renderLibrary() {
            const grid = document.getElementById('library-grid');
            if(!grid) return;
            const query = document.getElementById('library-search')?.value.toLowerCase() || '';
            const filtered = libraryBooks.filter(b => b.title.toLowerCase().includes(query));
            
            grid.innerHTML = filtered.map(b => `
                <div class="library-item">
                    <div class="library-item-title">${escapeHtml(b.title)}</div>
                    <div class="library-item-meta"><span>${b.format.toUpperCase()}</span></div>
                    <div style="display:flex; gap:8px;">
                        <button class="btn" onclick="previewBook('${escapeHtml(b.path)}')">\uD83D\uDC41 Preview</button>
                        <button class="btn btn-primary" onclick="convertFromLibrary('${escapeHtml(b.path)}')">Produce</button>
                    </div>
                </div>
            `).join('');
        }

        async function previewBook(path) {
            const modal = document.getElementById('preview-modal');
            const content = document.getElementById('preview-content');
            if(!modal || !content) return;
            content.innerHTML = '<div class="spinner"></div> Scanning manuscript...';
            modal.classList.remove('hidden');
            try {
                const resp = await fetch('/api/library/preview', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ path }) });
                const data = await resp.json();
                content.innerHTML = `<div>${escapeHtml(data.preview || data.error)}</div>`;
            } catch(e) { content.innerHTML = 'Error loading preview'; }
        }

        function closePreview() { document.getElementById('preview-modal')?.classList.add('hidden'); }

        async function convertFromLibrary(path) {
            const voice = document.getElementById('library-voice-select')?.value || 'en-GB-RyanNeural';
            await fetch('/api/library/convert', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ path, voice }) });
            switchTab('queue');
        }

        async function loadJobs() {
            try {
                const resp = await fetch('/api/jobs');
                const jobs = await resp.json();
                const active = jobs.filter(j => j.status === 'queued' || j.status.includes('converting'));
                const badge = document.getElementById('queue-badge');
                if(badge) {
                    badge.textContent = active.length;
                    badge.classList.toggle('hidden', active.length === 0);
                }
                const queueContent = document.getElementById('queue-content');
                if(queueContent && document.getElementById('tab-queue').classList.contains('active')) {
                    queueContent.innerHTML = active.map(j => `<div class="card"><strong>${escapeHtml(j.book_name)}</strong><br>Status: ${j.status}</div>`).join('') || 'No active production';
                }
            } catch(e) {}
        }

        async function loadHistory() {
            try {
                const resp = await fetch('/api/history');
                const jobs = await resp.json();
                const content = document.getElementById('history-content');
                if(!content) return;
                content.innerHTML = jobs.map(j => `<div class="library-item"><strong>${escapeHtml(j.book_name)}</strong><button class="btn" onclick="window.location.href=\'/api/jobs/${j.id}/download\'">\u2B07\uFE0F</button></div>`).join('') || 'Archive is empty';
            } catch(e) {}
        }

        async function loadGpuStatus() {
            try {
                const resp = await fetch('/api/gpu/status');
                const gpu = await resp.json();
                const label = document.getElementById('gpu-state-label');
                const dot = document.getElementById('gpu-state-dot');
                if(label) label.textContent = gpu.state || 'Offline';
                if(dot) dot.className = 'gpu-dot ' + (gpu.state || 'idle');
            } catch(e) {}
        }

        function escapeHtml(str) { if(!str) return ''; const div = document.createElement('div'); div.textContent = str; return div.innerHTML; }

        window.onload = () => {
            localStorage.removeItem('audiobook-tab'); // Force Library on first load for user
            const theme = localStorage.getItem('audiobook-theme') || 'light';
            setTheme(theme);
            switchTab('library');
            setInterval(loadGpuStatus, 10000);
            document.getElementById('library-search')?.addEventListener('input', renderLibrary);
        };
    </script>
</body>
</html>
