<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Audiobook Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@700&family=Outfit:wght@400;600&display=swap" rel="stylesheet">
    <style>/* Luxury/Editorial Theme */
:root {
    --bg-primary: #fdfcf9;
    --bg-card: #ffffff;
    --bg-sidebar: #1a1a1a;
    --bg-element: #f5f3ef;
    --bg-hover: #ece9e2;
    --accent: #c28e5e;
    --accent-hover: #a67246;
    --accent-subtle: rgba(194, 142, 94, 0.1);
    --text-primary: #1a1a1a;
    --text-secondary: #6b665f;
    --text-on-dark: #fdfcf9;
    --border: #e8e4de;
    --success: #4a7c59;
    --error: #af4d4d;
    --warning: #d4a373;
    --font-display: 'Lora', serif;
    --font-ui: 'Outfit', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
    --sidebar-width: 280px;
    --radius-lg: 24px;
    --radius-md: 12px;
    --radius-sm: 8px;
}

[data-theme="dark"] {
    --bg-primary: #0f0f0f;
    --bg-card: #1a1a1a;
    --bg-sidebar: #080808;
    --bg-element: #262626;
    --bg-hover: #333333;
    --text-primary: #f5f5f5;
    --text-secondary: #a3a3a3;
    --border: #262626;
    --shadow-md: 0 10px 25px -5px rgba(0,0,0,0.3);
}

* { box-sizing: border-box; -webkit-font-smoothing: antialiased; }

body {
    font-family: var(--font-ui);
    margin: 0;
    padding: 0;
    background: var(--bg-primary);
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    overflow: hidden;
}

.sidebar {
    width: var(--sidebar-width);
    background: var(--bg-sidebar);
    color: var(--text-on-dark);
    height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 40px 24px;
    position: fixed;
    left: 0; top: 0; z-index: 1000;
}

.sidebar-brand { margin-bottom: 60px; padding-left: 12px; }
.sidebar-brand .logo-text { font-family: var(--font-display); font-size: 1.8rem; font-weight: 700; }
.sidebar-brand .logo-sub { display: block; font-size: 0.75rem; text-transform: uppercase; color: var(--accent); margin-top: 4px; font-weight: 600; }

.nav-links { display: flex; flex-direction: column; gap: 8px; flex: 1; }
.nav-tab {
    background: transparent; border: none; color: rgba(255,255,255,0.5);
    padding: 14px 18px; border-radius: var(--radius-md); cursor: pointer;
    display: flex; align-items: center; gap: 16px; font-size: 1rem; width: 100%;
}
.nav-tab:hover { color: var(--text-on-dark); background: rgba(255,255,255,0.05); }
.nav-tab.active { background: var(--accent); color: #fff; }

.app-main {
    margin-left: var(--sidebar-width); flex: 1; height: 100vh; overflow-y: auto;
    display: flex; flex-direction: column; position: relative;
}

.top-bar { padding: 24px 40px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; background: rgba(253, 252, 249, 0.8); backdrop-filter: blur(10px); z-index: 900; }
.page-title { font-family: var(--font-display); font-size: 2rem; font-weight: 700; }

.content-body { padding: 0 40px 60px; max-width: 1200px; width: 100%; margin: 0 auto; }
.card { background: var(--bg-card); border-radius: var(--radius-lg); border: 1px solid var(--border); padding: 32px; margin-bottom: 32px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); }
.hidden { display: none !important; }

[data-theme="dark"] .card { background: #1a1a1a; border-color: #262626; color: #f5f5f5; }
[data-theme="dark"] .input-control { background: #262626; border-color: #333; color: #fff; }
[data-theme="dark"] .btn { background: #262626; border-color: #333; color: #fff; }
[data-theme="dark"] .top-bar { background: rgba(15, 15, 15, 0.8); border-color: #262626; }
[data-theme="dark"] .sidebar { border-right: 1px solid #262626; }
</style>
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-brand">
            <span class="logo-text">Studio</span>
            <span class="logo-sub">Audiobook Engine</span>
        </div>
        <nav class="nav-links">
            <button class="nav-tab active" data-tab="library"><i>📚</i> <span>Library</span></button>
            <button class="nav-tab" data-tab="convert"><i>📝</i> <span>Production</span></button>
            <button class="nav-tab" data-tab="queue"><i>⏳</i> <span>Queue</span> <span class="badge hidden" id="queue-badge">0</span></button>
            <button class="nav-tab" data-tab="voices"><i>🗣️</i> <span>Voices</span></button>
            <button class="nav-tab" data-tab="history"><i>📋</i> <span>Archive</span></button>
            <button class="nav-tab" data-tab="settings"><i>⚙️</i> <span>Config</span></button>
        </nav>
        <div class="sidebar-footer">
            <div id="gpu-sidebar-status"><span id="gpu-state-dot" class="gpu-dot"></span> <span id="gpu-state-label">GPU Offline</span></div>
        </div>
    </aside>
    <main class="app-main">
        <header class="top-bar">
            <h1 class="page-title" id="view-title">Library</h1>
            <div class="theme-selector">
                <button class="theme-btn active" data-theme="light">☀️</button>
                <button class="theme-btn" data-theme="dark">🌙</button>
            </div>
        </header>
        <div class="content-body">
            <div class="tab-panel active" id="tab-library">
                <div class="card">
                    <div style="display: flex; gap: 20px; align-items: center; margin-bottom: 32px;">
                        <input type="text" id="library-search" class="input-control" style="max-width: 400px;" placeholder="Search your library...">
                        <select id="library-voice-select" class="input-control" style="width: auto;">
                            <option value="en-GB-RyanNeural">Default: Ryan (British)</option>
                            {% for id, v in voices.items() %}
                            <option value="{{ id }}">{{ v.name }} ({{ v.accent }})</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div id="library-stats" style="font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 12px;"></div>
                    <div id="library-grid" class="library-grid"></div>
                </div>
            </div>
            <div class="tab-panel" id="tab-convert">
                <div class="card">
                    <form id="convert-form">
                        <div id="upload-area" style="border: 2px dashed var(--border); padding: 80px; text-align: center; border-radius: 20px; cursor: pointer;">
                            <div style="font-size: 4rem; margin-bottom: 20px;">📖</div>
                            <h3 id="file-name-display">Drop manuscript here</h3>
                            <div id="file-name" class="hidden"></div>
                        </div>
                        <input type="file" id="file-input" class="hidden">
                        <div style="margin-top: 40px; display: grid; grid-template-columns: 1fr 1fr; gap: 40px;">
                            <div class="input-group">
                                <label>Narrator</label>
                                <select id="voice-select-simple" class="input-control">
                                    <optgroup label="Edge (Stable)">
                                        {% for id, v in voices.items() if v.engine == 'edge' %}
                                        <option value="{{ id }}" {% if id == 'en-GB-RyanNeural' %}selected{% endif %}>{{ v.name }} ({{ v.accent }})</option>
                                        {% endfor %}
                                    </optgroup>
                                    <optgroup label="Kokoro (High Quality)">
                                        {% for id, v in voices.items() if v.engine == 'kokoro' %}
                                        <option value="{{ id }}">{{ v.name }} ({{ v.accent }})</option>
                                        {% endfor %}
                                    </optgroup>
                                </select>
                            </div>
                            <div class="input-group">
                                <label>Speed</label>
                                <input type="number" id="tts-speed" class="input-control" step="0.1" value="1.0">
                            </div>
                        </div>
                        <button type="submit" id="convert-btn" class="btn btn-primary" style="margin-top: 32px; height: 60px;">Start Production</button>
                    </form>
                </div>
            </div>
            <div class="tab-panel" id="tab-queue"><div class="card"><div id="queue-content"></div></div></div>
            <div class="tab-panel" id="tab-voices"><div class="card"><div id="kokoro-voices"></div></div></div>
            <div class="tab-panel" id="tab-history"><div class="card"><div id="history-content"></div></div></div>
            <div class="tab-panel" id="tab-settings">
                <div class="card">
                    <div class="setting-row">
                        <div class="input-group"><label>Polly Secret</label><input type="password" id="setting-AWS_SECRET_ACCESS_KEY" class="input-control"></div>
                        <div class="input-group"><label>OpenAI Key</label><input type="password" id="setting-OPENAI_API_KEY" class="input-control"></div>
                    </div>
                    <button id="save-settings-btn" class="btn btn-primary" style="width:auto;">Save Infrastructure Config</button>
                </div>
            </div>
        </div>
    </main>
    <div id="preview-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <button class="modal-close" onclick="closePreview()">✕</button>
            <h2 id="preview-title" style="font-family: var(--font-display); margin: 0;">Manuscript Preview</h2>
            <p id="preview-title-text" style="font-size: 0.9rem; color: var(--text-secondary); margin: 4px 0 20px 0;"></p>
            <div id="preview-content"></div>
        </div>
    </div>
    <audio id="preview-audio"></audio>
<script>﻿
        // ============ State ============
        const voices = {{ voices | tojson }};
        let selectedFile = null;
        let selectedVoice = 'en-GB-RyanNeural';
        let selectedEngine = 'kokoro';
        let currentPreviewBtn = null;
        let libraryBooks = [];
        let allJobs = [];

        // ============ DOM Elements ============
        const uploadArea = document.getElementById('upload-area');
        const fileInput = document.getElementById('file-input');
        const fileName = document.getElementById('file-name');
        const selectedVoiceInput = document.getElementById('selected-voice');
        const selectedEngineInput = document.getElementById('selected-engine');
        const convertBtn = document.getElementById('convert-btn');
        const convertForm = document.getElementById('convert-form');
        const previewAudio = document.getElementById('preview-audio');
        const queueBadge = document.getElementById('queue-badge');

        // ============ Theme Handling ============
        const savedTheme = localStorage.getItem('audiobook-theme') || 'light';
        if (savedTheme !== 'light') {
            document.documentElement.setAttribute('data-theme', savedTheme);
        }
        document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
        document.querySelector(`.theme-btn[data-theme="${savedTheme}"]`)?.classList.add('active');

        document.querySelectorAll('.theme-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const theme = btn.dataset.theme;
                if (theme === 'light') {
                    document.documentElement.removeAttribute('data-theme');
                } else {
                    document.documentElement.setAttribute('data-theme', theme);
                }
                localStorage.setItem('audiobook-theme', theme);
                document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            });
        });

        // ============ Design Mode Handling ============
        const savedDesign = localStorage.getItem('audiobook-design') || 'studio';
        if (savedDesign !== 'studio') {
            document.documentElement.setAttribute('data-design', savedDesign);
        }
        document.querySelectorAll('.design-btn').forEach(b => b.classList.remove('active'));
        document.querySelector(`.design-btn[data-design="${savedDesign}"]`)?.classList.add('active');

        document.querySelectorAll('.design-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const design = btn.dataset.design;
                if (design === 'studio') {
                    document.documentElement.removeAttribute('data-design');
                } else {
                    document.documentElement.setAttribute('data-design', design);
                }
                localStorage.setItem('audiobook-design', design);
                document.querySelectorAll('.design-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            });
        });

        // ============ Tab Navigation ============
        const savedTab = localStorage.getItem('audiobook-tab') || 'library';

        function switchTab(tabId) {
            document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));

            document.querySelector('.nav-tab[data-tab="' + tabId + '"]')?.classList.add('active');
            document.getElementById('tab-' + tabId)?.classList.add('active');
            document.getElementById('view-title').textContent = tabId.charAt(0).toUpperCase() + tabId.slice(1);

            localStorage.setItem('audiobook-tab', tabId);

            // Load data for specific tabs
            if (tabId === 'queue') loadJobs();
            if (tabId === 'library') loadLibrary();
            if (tabId === 'ops') loadOps();
            if (tabId === 'history') loadHistory();
            if (tabId === 'settings') loadSettings();
        }

        document.querySelectorAll('.nav-tab').forEach(tab => {
            tab.addEventListener('click', () => switchTab(tab.dataset.tab));
        });

        // Initialize saved tab
        switchTab(savedTab);

        // ============ Engine Tab Handling ============
        document.querySelectorAll('.engine-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                const engine = tab.dataset.engine;
                selectedEngine = engine;
                selectedEngineInput.value = engine;

                document.querySelectorAll('.engine-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');

                document.querySelectorAll('.engine-voices').forEach(v => v.classList.add('hidden'));
                document.getElementById(`${engine}-voices`).classList.remove('hidden');

                // Select first voice of new engine
                document.querySelectorAll('.voice-pill').forEach(c => c.classList.remove('selected'));
                const firstVoice = document.querySelector(`#${engine}-voices .voice-pill`);
                if (firstVoice) {
                    firstVoice.classList.add('selected');
                    selectedVoice = firstVoice.dataset.voice;
                    selectedVoiceInput.value = selectedVoice;
                }
                updateConvertButton();
            });
        });

        document.getElementById('voice-select-simple')?.addEventListener('change', (e) => {
            const voiceId = e.target.value;
            selectedVoice = voiceId;
            selectedVoiceInput.value = voiceId;
            updateConvertButton();
        });

        // ============ Voice Search ============
        document.getElementById('voice-search').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const currentEngine = selectedEngine;

            document.querySelectorAll(`#${currentEngine}-voices .voice-pill`).forEach(pill => {
                const name = pill.dataset.name.toLowerCase();
                pill.classList.toggle('hidden', !name.includes(query));
            });
        });

        // ============ WhatsApp Toggle ============
        document.getElementById('notify-whatsapp').addEventListener('change', (e) => {
            document.getElementById('whatsapp-container').classList.toggle('visible', e.target.checked);
        });

        // Library WhatsApp Toggle
        document.getElementById('library-notify-whatsapp').addEventListener('change', (e) => {
            document.getElementById('library-whatsapp-number').classList.toggle('visible', e.target.checked);
        });

        // ============ File Upload ============
        uploadArea.addEventListener('click', () => fileInput.click());

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length) {
                handleFile(files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length) {
                handleFile(e.target.files[0]);
            }
        });

        function handleFile(file) {
            const validExtensions = ['.epub', '.pdf', '.mobi', '.azw3', '.fb2', '.txt', '.html', '.htm', '.docx'];
            const ext = '.' + file.name.split('.').pop().toLowerCase();

            if (!validExtensions.includes(ext)) {
                alert('Unsupported file format. Please use: ' + validExtensions.join(', '));
                return;
            }

            selectedFile = file;
            const format = ext.toUpperCase().replace('.', '');
            fileName.innerHTML = `<span class="file-badge">${format}</span> ${escapeHtml(file.name)}`;
            fileName.classList.remove('hidden');
            uploadArea.classList.add('has-file');
            updateConvertButton();
        }

        // ============ Voice Selection ============
        document.querySelectorAll('.voice-pill').forEach(pill => {
            pill.addEventListener('click', (e) => {
                if (e.target.classList.contains('preview-btn')) return;
                document.querySelectorAll('.voice-pill').forEach(c => c.classList.remove('selected'));
                pill.classList.add('selected');
                selectedVoice = pill.dataset.voice;
                selectedVoiceInput.value = selectedVoice;
                updateConvertButton();
            });
        });

        // Select default voice
        document.querySelector('[data-voice="bf_emma"]')?.classList.add('selected');

        // ============ Voice Preview ============
        document.querySelectorAll('.preview-btn').forEach(btn => {
            btn.addEventListener('click', async (e) => {
                e.stopPropagation();
                const voiceId = btn.dataset.voice;

                if (currentPreviewBtn) {
                    currentPreviewBtn.textContent = 'â–¶';
                    currentPreviewBtn.classList.remove('loading');
                }

                if (previewAudio.src && !previewAudio.paused && currentPreviewBtn === btn) {
                    previewAudio.pause();
                    btn.textContent = 'â–¶';
                    currentPreviewBtn = null;
                    return;
                }

                btn.textContent = 'â³';
                btn.classList.add('loading');
                currentPreviewBtn = btn;

                try {
                    previewAudio.src = `/api/preview/${voiceId}`;
                    await previewAudio.play();
                    btn.textContent = 'â¹';
                    btn.classList.remove('loading');
                } catch (err) {
                    btn.textContent = 'âŒ';
                    btn.classList.remove('loading');
                    setTimeout(() => btn.textContent = 'â–¶', 2000);
                }
            });
        });

        previewAudio.addEventListener('ended', () => {
            if (currentPreviewBtn) {
                currentPreviewBtn.textContent = 'â–¶';
                currentPreviewBtn = null;
            }
        });

        // ============ Convert Button ============
        function updateConvertButton() {
            if (selectedFile && selectedVoice) {
                convertBtn.disabled = false;
                const voiceName = document.querySelector(`[data-voice="${selectedVoice}"] .voice-pill-name`)?.textContent || selectedVoice;
                convertBtn.innerHTML = `<span>ðŸŽ§</span> Convert "${escapeHtml(selectedFile.name.substring(0, 30))}" with ${voiceName}`;
            } else {
                convertBtn.disabled = true;
                convertBtn.innerHTML = '<span>ðŸŽ§</span> Select a file and voice to start';
            }
        }

        // ============ Form Submission ============
        convertForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!selectedFile) return;

            convertBtn.disabled = true;
            convertBtn.innerHTML = '<span class="spinner"></span> Starting conversion...';

            const formData = new FormData();
            formData.append('file', selectedFile);
            formData.append('voice', selectedVoice);
            formData.append('voice2', document.getElementById('voice2-select').value);
            formData.append('start_chapter', document.getElementById('start-chapter').value);
            formData.append('end_chapter', document.getElementById('end-chapter').value);
            formData.append('notify_telegram', document.getElementById('notify-telegram').checked ? '1' : '');
            formData.append('notify_whatsapp', document.getElementById('notify-whatsapp').checked ? '1' : '');
            formData.append('whatsapp_number', document.getElementById('whatsapp-number').value);
            formData.append('newline_mode', document.querySelector('[name="newline_mode"]').value);
            formData.append('title_mode', document.querySelector('[name="title_mode"]').value);
            formData.append('custom_regex', document.querySelector('[name="custom_regex"]').value);

            try {
                const response = await fetch('/api/convert', {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                if (result.error) {
                    alert('Error: ' + result.error);
                } else {
                    // Reset form
                    selectedFile = null;
                    fileInput.value = '';
                    fileName.classList.add('hidden');
                    uploadArea.classList.remove('has-file');
                    document.getElementById('voice2-select').value = '';
                    document.getElementById('start-chapter').value = '';
                    document.getElementById('end-chapter').value = '';
                    document.getElementById('notify-telegram').checked = false;
                    document.getElementById('notify-whatsapp').checked = false;
                    document.getElementById('whatsapp-container').classList.remove('visible');
                    document.querySelector('[name="newline_mode"]').value = 'double';
                    document.querySelector('[name="title_mode"]').value = 'auto';
                    document.querySelector('[name="custom_regex"]').value = '';

                    // Switch to queue tab
                    switchTab('queue');
                }
            } catch (err) {
                alert('Failed to start conversion: ' + err.message);
            }

            convertBtn.disabled = true;
            convertBtn.innerHTML = '<span>ðŸŽ§</span> Select a file and voice to start';
        });

        // ============ Queue/Jobs Loading ============
        async function loadJobs() {
            try {
                const response = await fetch('/api/jobs');
                allJobs = await response.json();

                const activeJobs = allJobs.filter(j =>
                    j.status === 'queued' || j.status.includes('converting')
                );
                const waitingJobs = allJobs.filter(j => j.status === 'queued');
                const convertingJob = allJobs.find(j => j.status.includes('converting'));

                // Update badge
                if (activeJobs.length > 0) {
                    queueBadge.textContent = activeJobs.length;
                    queueBadge.classList.remove('hidden');
                } else {
                    queueBadge.classList.add('hidden');
                }

                const queueContent = document.getElementById('queue-content');

                if (activeJobs.length === 0) {
                    queueContent.innerHTML = `
                        <div class="no-jobs-message">
                            <div class="no-jobs-icon">â³</div>
                            <div>No active conversions</div>
                        </div>
                    `;
                    return;
                }

                let html = '';

                // Currently converting
                if (convertingJob) {
                    const progress = convertingJob.progress_percent || 0;
                    const voiceInfo = convertingJob.voice2_name
                        ? `${convertingJob.voice_name} + ${convertingJob.voice2_name}`
                        : convertingJob.voice_name;

                    html += `
                        <div class="queue-section">
                            <div class="queue-section-header">
                                <span class="queue-section-title">Converting Now</span>
                            </div>
                            <div class="active-job-card">
                                <div class="active-job-header">
                                    <span class="active-job-title">${escapeHtml(convertingJob.book_name)}</span>
                                    <span class="active-job-chapter">
                                        ${convertingJob.current_chapter ? `Ch ${convertingJob.current_chapter}/${convertingJob.total_chapters || '?'}` : 'Starting...'}
                                        (${progress}%)
                                    </span>
                                </div>
                                <div class="progress-bar">
                                    <div class="progress-fill" style="width: ${progress}%"></div>
                                </div>
                                <div class="progress-info">
                                    <span>${convertingJob.current_chapter_name || 'Processing...'}</span>
                                    <span>${convertingJob.eta_minutes ? `ETA: ${convertingJob.eta_minutes} min` : ''}</span>
                                </div>
                                <div class="active-job-meta">
                                    <span class="active-job-voice">Voice: ${voiceInfo}</span>
                                    <div class="job-actions">
                                        <button class="job-btn job-btn-danger" onclick="cancelJob('${convertingJob.id}')">Cancel</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                }

                // Waiting queue
                if (waitingJobs.length > 0) {
                    html += `
                        <div class="queue-section">
                            <div class="queue-section-header">
                                <span class="queue-section-title">Waiting</span>
                                <span class="queue-count">${waitingJobs.length}</span>
                            </div>
                            <div class="waiting-list">
                                ${waitingJobs.map((job, i) => `
                                    <div class="waiting-item">
                                        <div class="waiting-item-info">
                                            <span class="waiting-item-number">${i + 1}</span>
                                            <span class="waiting-item-title">${escapeHtml(job.book_name)}</span>
                                        </div>
                                        <div class="job-actions">

        async function moveQueue(jobId, delta) {
            const waitingJobs = allJobs.filter(j => j.status === 'queued');
            const idx = waitingJobs.findIndex(j => j.id === jobId);
            if (idx < 0) return;
            const target = idx + delta;
            if (target < 0 || target >= waitingJobs.length) return;
            const ordered = waitingJobs.map(j => j.id);
            [ordered[idx], ordered[target]] = [ordered[target], ordered[idx]];
            await fetch('/api/queue/reorder', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ordered_ids: ordered })
            });
            loadJobs();
            if (document.getElementById('tab-ops').classList.contains('active')) {
                loadOps();
            }
        }

        async function loadGpuStatus() {
            try {
                const resp = await fetch('/api/gpu/status');
                const gpu = await resp.json();
                _gpuState = gpu.state || 'idle';

                // State dot
                                // State dot
                const dot = document.getElementById('gpu-state-dot');
                if (dot) dot.className = 'gpu-dot ' + _gpuState;

                // State label
                const labels = { idle: 'GPU Offline', provisioning: 'Provisioning...', active: 'GPU Active', error: 'GPU Error' };
                const label = document.getElementById('gpu-state-label');
                if (label) label.textContent = labels[_gpuState] || _gpuState;

                const detailRow = document.getElementById('gpu-detail-row');
                if (_gpuState === 'active') {
                    detailRow?.classList.remove('hidden');
                    const inst = document.getElementById('gpu-instance-id');
                    if (inst) inst.textContent = `Instance: ${gpu.instance_id || 'Unknown'}`;
                } else {
                    detailRow?.classList.add('hidden');
                }

                // Mode badge
                const badge = document.getElementById('gpu-mode-badge');
                const isGpu = _gpuState === 'active';
                badge.textContent = isGpu ? 'GPU' : 'CPU';
                badge.className = 'gpu-mode-badge ' + (isGpu ? 'gpu' : 'cpu');

                // Telemetry strip
                const telemetry = document.getElementById('gpu-telemetry');
                if (_gpuState === 'active' || _gpuState === 'provisioning') {
                    telemetry.classList.remove('hidden');
                    const mins = gpu.session_minutes || 0;
                    document.getElementById('gpu-session-time').textContent =
                        mins >= 60 ? `${Math.floor(mins/60)}h ${Math.round(mins%60)}m` : `${Math.round(mins)}m`;
                    document.getElementById('gpu-session-cost').textContent = `$${(gpu.session_cost || 0).toFixed(2)}`;
                    document.getElementById('gpu-cost-cap').textContent = `$${(gpu.cost_cap || 1).toFixed(2)}`;

                    const pct = Math.min(100, ((gpu.session_cost || 0) / (gpu.cost_cap || 1)) * 100);
                    const fill = document.getElementById('gpu-cap-fill');
                    fill.style.width = pct + '%';
                    fill.className = 'gpu-cap-fill' + (pct > 80 ? ' danger' : pct > 50 ? ' warning' : '');
                } else {
                    telemetry.classList.add('hidden');
                }

                // Controls
                document.getElementById('gpu-scale-up-btn').disabled = (_gpuState === 'active' || _gpuState === 'provisioning');
                document.getElementById('gpu-scale-down-btn').disabled = (_gpuState === 'idle');

                // Auto-scale label
                const autoLabel = document.getElementById('gpu-auto-label');
                if (gpu.autoscale_enabled) {
                    autoLabel.innerHTML = `Auto: <span class="on">ON (â‰¥${gpu.autoscale_threshold} books)</span>`;
                } else {
                    autoLabel.innerHTML = `Auto: <span class="off">OFF</span>`;
                }

                // Header pip
                const pip = document.getElementById('gpu-header-pip');
                if (isGpu) {
                    pip.classList.remove('hidden');
                } else {
                    pip.classList.add('hidden');
                }

                // Fast polling when GPU is not idle
                if (_gpuState !== 'idle' && !_gpuPollTimer) {
                    _gpuPollTimer = setInterval(loadGpuStatus, 10000);
                } else if (_gpuState === 'idle' && _gpuPollTimer) {
                    clearInterval(_gpuPollTimer);
                    _gpuPollTimer = null;
                }
            } catch (err) {
                console.error('GPU status error:', err);
            }
        }

        async function saveSettings() {
            const btn = document.getElementById('save-settings-btn');
            const status = document.getElementById('settings-status');
            
            const keys = [
                'AWS_ACCESS_KEY_ID', 'AWS_SECRET_ACCESS_KEY', 'AWS_REGION',
                'OPENAI_API_KEY', 'TELEGRAM_BOT_TOKEN'
            ];
            
            const data = {};
            keys.forEach(key => {
                const val = document.getElementById(`setting-${key}`)?.value;
                if (val && val.trim() && !val.includes('...')) {
                    data[key] = val.trim();
                }
            });

            if (Object.keys(data).length === 0) {
                status.textContent = 'No changes to save.';
                status.style.color = 'var(--warning)';
                return;
            }

            btn.disabled = true;
            status.textContent = 'Saving...';
            status.style.color = 'var(--text-secondary)';

            try {
                const response = await fetch('/api/settings', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    status.textContent = 'âœ… Settings saved successfully!';
                    status.style.color = 'var(--success)';
                    // Clear password fields
                    keys.forEach(key => {
                        const input = document.getElementById(`setting-${key}`);
                        if (input && input.type === 'password') input.value = '';
                    });
                    loadSettings();
                } else {
                    throw new Error('Failed to save');
                }
            } catch (err) {
                status.textContent = 'âŒ Error: ' + err.message;
                status.style.color = 'var(--error)';
            } finally {
                btn.disabled = false;
            }
        }

        function renderLibrary() {
            const libraryGrid = document.getElementById('library-grid');
            const searchQuery = document.getElementById('library-search').value.toLowerCase();

            const filtered = libraryBooks.filter(book =>
                book.title.toLowerCase().includes(searchQuery)
            );

            const sortKey = (document.getElementById('library-sort-key')?.value || 'title');
            const sortDir = (document.getElementById('library-sort-dir')?.value || 'asc');

            const statusRank = (s) => {
                if (s === 'converting') return 0;
                if (s === 'available') return 1;
                if (s === 'completed') return 2;
                return 3;
            };

            const dirMul = sortDir === 'desc' ? -1 : 1;
            const sorted = [...filtered].sort((a, b) => {
                const at = (a?.title || '').toLowerCase();
                const bt = (b?.title || '').toLowerCase();

                let cmp = 0;
                if (sortKey === 'modified_ts') {
                    const av = Number(a?.modified_ts || 0);
                    const bv = Number(b?.modified_ts || 0);
                    cmp = av === bv ? 0 : (av < bv ? -1 : 1);
                } else if (sortKey === 'size') {
                    const av = Number(a?.size || 0);
                    const bv = Number(b?.size || 0);
                    cmp = av === bv ? 0 : (av < bv ? -1 : 1);
                } else if (sortKey === 'status') {
                    const av = statusRank(a?.status || '');
                    const bv = statusRank(b?.status || '');
                    cmp = av === bv ? 0 : (av < bv ? -1 : 1);
                } else {
                    cmp = at.localeCompare(bt);
                }

                if (cmp === 0) cmp = at.localeCompare(bt);
                return cmp * dirMul;

                    if (data.estimated_cost !== undefined) {
                        costValue.textContent = `$${data.estimated_cost.toFixed(2)}`;
                        charLabel.textContent = `(~${(data.char_count / 1000).toFixed(0)}k chars)`;
                        
                        // Handle GPU info if present
                        const gpuLabel = drawer.querySelector('.gpu-trigger-info');
                        if (data.gpu_info && data.gpu_info.triggered) {
                            if (!gpuLabel) {
                                const el = document.createElement('div');
                                el.className = 'gpu-trigger-info';
                                el.style.fontSize = '0.85em';
                                el.style.color = 'var(--accent)';
                                el.style.marginTop = '4px';
                                el.innerHTML = `âš¡ Will trigger GPU rent: <strong>${data.gpu_info.rate}</strong>`;
                                drawer.querySelector('.cfg-cost-estimate').appendChild(el);
                            } else {
                                gpuLabel.innerHTML = `âš¡ Will trigger GPU rent: <strong>${data.gpu_info.rate}</strong>`;
                                gpuLabel.style.display = 'block';
                            }
                        } else if (gpuLabel) {
                            gpuLabel.style.display = 'none';
                        }

                        // Highlight if not free
                        if (data.estimated_cost > 0) {
                            costValue.style.color = 'var(--warning)';
                        } else {
                            costValue.style.color = 'inherit';
                        }
                    }
                } catch (err) {
                    console.error('Cost estimation failed:', err);
                }
            };

            // Wire up config buttons
            document.querySelectorAll('.library-config-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const path = btn.dataset.path;
                    const bookId = btoa(path).replace(/[^a-z0-9]/gi, '');
                    const drawer = document.getElementById(`config-${bookId}`);
                    const isActive = drawer?.classList.toggle('active');
                    btn.classList.toggle('active');

                    if (isActive) {
                        updateDrawerEstimate(drawer, path);
                    }
                });
            });

            // Wire up voice change in drawers
            document.querySelectorAll('.cfg-voice').forEach(select => {
                select.addEventListener('change', (e) => {
                    const drawer = e.target.closest('.library-item-config');
                    const path = drawer.id.replace('config-', '');
                    // We need the original path which is stored on the start button
                    const originalPath = drawer.querySelector('.library-start-btn').dataset.path;
                    updateDrawerEstimate(drawer, originalPath);
                });
            });

            // Wire up start buttons inside drawers
            document.querySelectorAll('.library-start-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const path = btn.dataset.path;
                    const title = btn.dataset.title;
                    const bookId = btn.dataset.id;
                    const drawer = document.getElementById(`config-${bookId}`);
                    
                    const options = {
                        voice: drawer.querySelector('.cfg-voice').value || document.getElementById('library-voice-select').value,
                        tts_speed: parseFloat(drawer.querySelector('.cfg-speed').value) || 1.0,
                        start_chapter: drawer.querySelector('.cfg-start').value || null,
                        end_chapter: drawer.querySelector('.cfg-end').value || null,
                        custom_regex: drawer.querySelector('.cfg-regex').value || null
                    };
                    
                    convertFromLibrary(path, title, options);
                });
            });

            // Wire up quick convert buttons
            document.querySelectorAll('.library-convert-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const path = btn.dataset.path || '';
                    const title = btn.dataset.title || '';
                    convertFromLibrary(path, title);
                });
            });
        }

        document.getElementById('library-search').addEventListener('input', renderLibrary);
        document.getElementById('library-sort-key').addEventListener('change', () => {
            localStorage.setItem('librarySortKey', document.getElementById('library-sort-key').value);
            renderLibrary();
        });
        document.getElementById('library-sort-dir').addEventListener('change', () => {
            localStorage.setItem('librarySortDir', document.getElementById('library-sort-dir').value);
            renderLibrary();
        });

        // Restore library sort prefs (defaults: Title + Asc).
        (() => {
            const k = localStorage.getItem('librarySortKey');
            const d = localStorage.getItem('librarySortDir');
            if (k) document.getElementById('library-sort-key').value = k;
            if (d) document.getElementById('library-sort-dir').value = d;
        })();

        async function convertFromLibrary(path, title, options = {}) {
            const voice = options.voice || document.getElementById('library-voice-select').value;
            const notifyWhatsapp = document.getElementById('library-notify-whatsapp').checked;
            const notifyTelegram = document.getElementById('library-notify-telegram').checked;
            const whatsappNumber = document.getElementById('library-whatsapp-number').value;

            try {
                const response = await fetch('/api/library/convert', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        path,
                        voice,
                        notify_whatsapp: notifyWhatsapp,
                        notify_telegram: notifyTelegram,
                        whatsapp_number: whatsappNumber,
                        tts_speed: options.tts_speed || 1.0,
                        start_chapter: options.start_chapter,
                        end_chapter: options.end_chapter,
                        custom_regex: options.custom_regex
                    })
                });

                const contentType = response.headers.get('content-type') || '';
                const raw = await response.text();
                let result = null;
                if (contentType.includes('application/json')) {
                    try { result = JSON.parse(raw); } catch { result = null; }
                }
                if (!result) {
                    const prefix = (raw || '').slice(0, 200).replace(/\s+/g, ' ').trim();
                    throw new Error(`HTTP ${response.status} non-JSON response: ${prefix || '(empty)'}`);
                }
                if (result.error) {
                    alert('Error: ' + result.error);
                } else {
                    switchTab('queue');
                }
            } catch (err) {
                alert('Failed to start conversion: ' + err.message);
            }
        }

        // ============ Job Actions ============
        async function cancelJob(jobId) {
            if (!confirm('Cancel this conversion?')) return;
            try {
                await fetch(`/api/jobs/${jobId}/cancel`, { method: 'POST' });
                loadJobs();
            } catch (err) {
                alert('Failed to cancel job: ' + err.message);
            }
        }

        async function retryJob(jobId) {
            try {
                const response = await fetch(`/api/jobs/${jobId}/retry`, { method: 'POST' });
                const result = await response.json();
                if (!response.ok || result.error) {
                    alert('Retry failed: ' + (result.error || `HTTP ${response.status}`));
                    return;
                }
                switchTab('queue');
            } catch (err) {
                alert('Failed to retry job: ' + err.message);
            }
        }

        function downloadJob(jobId) {
            window.location.href = `/api/jobs/${jobId}/download`;
        }

        async function syncJob(jobId) {
            try {
                const response = await fetch(`/api/jobs/${jobId}/sync`, { method: 'POST' });
                const result = await response.json();
                if (result.error) {
                    alert('Sync failed: ' + result.error);
                } else {
                    alert('Synced to Audiobookshelf!');
                    loadHistory();
                }
            } catch (err) {
                alert('Failed to sync: ' + err.message);
            }
        }

        async function deleteJob(jobId) {
            if (!confirm('Delete this job and its files?')) return;
            try {
                await fetch(`/api/jobs/${jobId}/delete`, { method: 'DELETE' });
                loadHistory();
                loadJobs();
            } catch (err) {
                alert('Failed to delete job: ' + err.message);
            }
        }

        // Clear all history
        document.getElementById('clear-history-btn').addEventListener('click', async () => {
            if (!confirm('Delete ALL completed conversions and their files?')) return;

            try {
                const response = await fetch('/api/history');
                const history = await response.json();

                for (const job of history) {
                    await fetch(`/api/jobs/${job.id}/delete`, { method: 'DELETE' });
                }

                loadHistory();
            } catch (err) {
                alert('Failed to clear history: ' + err.message);
            }
        });

        // ============ Utility Functions ============
        function escapeHtml(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        document.getElementById('save-settings-btn')?.addEventListener('click', saveSettings);

        // ============ Initial Load ============
        loadJobs();
        loadGpuStatus();
        setInterval(loadJobs, 15000);
    

async function previewBook(path) {
    const modal = document.getElementById('preview-modal');
    const content = document.getElementById('preview-content');
    const title = document.getElementById('preview-title-text');
    
    content.innerHTML = '<div class="spinner"></div> Scanning manuscript...';
    title.textContent = path.split('/').pop();
    modal.classList.remove('hidden');

    try {
        const resp = await fetch('/api/library/preview', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ path })
        });
        const data = await resp.json();
        if (data.error) throw new Error(data.error);
        
        content.innerHTML = `<div style="white-space: pre-wrap; line-height: 1.6; font-family: var(--font-display); font-size: 1.1rem;">${escapeHtml(data.preview)}</div>`;
    } catch (err) {
        content.innerHTML = `<div class="error-box">${escapeHtml(err.message)}</div>`;
    }
}

function closePreview() {
    document.getElementById('preview-modal').classList.add('hidden');
}
</script></body></html>
