<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Audiobook Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Outfit:wght@100..900&display=swap" rel="stylesheet">
<style>
:root {
    --bg-primary: #ebebe8; --bg-card: #ffffff; --bg-sidebar: #121212; --bg-element: #dadad7; --bg-hover: #c8c8c5;
    --accent: #c28e5e; --text-primary: #1a1a1a; --text-secondary: #5a5a57; --text-on-dark: #f8f8f5;
    --border: #cacaca; --radius-lg: 24px; --radius-md: 12px; --radius-sm: 8px;
    --success: #4a7c59; --error: #af4d4d; --warning: #d4a373;
}
[data-theme="dark"] {
    --bg-primary: #0a0a0a; --bg-card: #141414; --bg-sidebar: #050505; --bg-element: #1f1f1f; --bg-hover: #2a2a2a;
    --text-primary: #f0f0f0; --text-secondary: #a0a0a0; --border: #262626;
}
* { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
body { font-family: 'Outfit', sans-serif; background: var(--bg-primary); color: var(--text-primary); margin: 0; display: flex; height: 100vh; overflow: hidden; transition: 0.3s; }

.tab-panel { display: none !important; width: 100%; height: 100%; overflow-y: auto; }
.tab-panel.active { display: block !important; animation: fadeIn 0.4s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

.sidebar { width: 280px; background: var(--bg-sidebar); color: var(--text-on-dark); padding: 48px 24px; display: flex; flex-direction: column; position: fixed; left: 0; top: 0; bottom: 0; z-index: 1000; }
.sidebar-brand { margin-bottom: 64px; font-family: 'Lora', serif; font-size: 2.2rem; font-weight: 700; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 24px; }
.nav-links { display: flex; flex-direction: column; gap: 8px; flex: 1; }
.nav-tab { background: transparent; border: none; color: rgba(255,255,255,0.4); padding: 16px 24px; border-radius: 12px; cursor: pointer; display: flex; align-items: center; gap: 16px; font-size: 1.1rem; text-align: left; transition: 0.2s; width: 100%; }
.nav-tab:hover { background: rgba(255,255,255,0.05); color: #fff; }
.nav-tab.active { background: var(--accent); color: #fff; box-shadow: 0 8px 20px rgba(194, 142, 94, 0.25); }

.app-main { flex: 1; margin-left: 280px; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
.top-bar { padding: 32px 64px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; background: var(--bg-primary); border-bottom: 1px solid var(--border); z-index: 100; backdrop-filter: blur(12px); opacity: 0.98; flex-shrink: 0; }
.page-title { font-family: 'Lora', serif; font-size: 2.5rem; font-weight: 700; margin: 0; }

.content-body { padding: 64px; max-width: 1400px; width: 100%; margin: 0 auto; }
.card { background: var(--bg-card); border-radius: var(--radius-lg); border: 1px solid var(--border); padding: 48px; margin-bottom: 48px; box-shadow: 0 10px 30px -10px rgba(0,0,0,0.05); position: relative; }

.btn { padding: 14px 28px; border-radius: 12px; font-weight: 700; cursor: pointer; border: 1px solid var(--border); background: var(--bg-element); color: var(--text-primary); transition: 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 10px; font-family: 'Outfit'; font-size: 1rem; }
.btn:hover { border-color: var(--accent); background: var(--bg-hover); }
.btn-primary { background: #1a1a1a; color: #fff; border: 2px solid #1a1a1a; }
.btn-primary:hover { background: var(--accent); border-color: var(--accent); box-shadow: 0 8px 20px rgba(194, 142, 94, 0.3); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }

.input-control { width: 100%; padding: 14px 18px; background: var(--bg-element); border: 1px solid var(--border); border-radius: 12px; color: var(--text-primary); font-family: 'Outfit'; font-size: 1rem; transition: 0.2s; }
.input-control:focus { border-color: var(--accent); outline: none; }

.library-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(450px, 1fr)); gap: 32px; }
.library-item { background: var(--bg-card); border: 1px solid var(--border); border-radius: 20px; padding: 32px; transition: all 0.3s; display: flex; flex-direction: column; }
.library-item:hover { border-color: var(--accent); transform: translateY(-6px); box-shadow: 0 20px 40px -15px rgba(0,0,0,0.1); }
.library-item-title { font-family: 'Lora', serif; font-size: 1.4rem; font-weight: 700; margin-bottom: 12px; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

.options-drawer { display: none; margin-top: 32px; border-top: 1px solid var(--border); padding-top: 32px; animation: fadeIn 0.3s ease; }
.options-drawer.active { display: block; }

.status-banner { padding: 12px 20px; border-radius: 10px; font-size: 0.9rem; font-weight: 700; margin-bottom: 24px; display: flex; align-items: center; gap: 12px; }
.status-banner.queued { background: var(--bg-element); color: var(--text-secondary); }
.status-banner.converting { background: var(--accent-subtle); color: var(--accent); border: 1px solid var(--accent); }
.status-banner.completed { background: #eef7f2; color: var(--success); border: 1px solid var(--success); }
.status-banner.failed { background: #fdf2f2; color: var(--error); border: 1px solid var(--error); }

.voice-engine-badge { font-size: 0.7rem; background: var(--accent); color: #fff; padding: 2px 8px; border-radius: 10px; text-transform: uppercase; font-weight: 900; margin-bottom: 8px; display: inline-block; }
.voices-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 24px; }
.voice-card { background: var(--bg-element); border: 1px solid var(--border); border-radius: 16px; padding: 24px; display: flex; justify-content: space-between; align-items: center; transition: 0.2s; }
.voice-card:hover { border-color: var(--accent); background: var(--bg-hover); }

.modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; z-index: 2000; }
.modal-content { background: var(--bg-card); width: 90%; max-width: 1000px; max-height: 85vh; border-radius: var(--radius-lg); padding: 48px; position: relative; display: flex; flex-direction: column; box-shadow: 0 40px 80px -20px rgba(0,0,0,0.4); }
.modal-close { position: absolute; top: 24px; right: 24px; background: transparent; border: none; font-size: 2rem; cursor: pointer; color: var(--text-secondary); }
#preview-text { overflow-y: auto; flex: 1; margin-top: 32px; font-family: 'Lora', serif; font-size: 1.3rem; line-height: 1.8; white-space: pre-wrap; padding-right: 24px; }

.progress-container { width: 100%; height: 8px; background: var(--bg-element); border-radius: 10px; margin: 12px 0; overflow: hidden; }
.progress-fill { height: 100%; background: var(--accent); transition: width 0.5s ease; }

.metrics-row { display: flex; gap: 32px; margin-top: 8px; font-size: 0.85rem; font-weight: 600; color: var(--text-secondary); }
.metric-item { display: flex; align-items: center; gap: 6px; }

.gpu-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 10px; background: #444; }
.gpu-dot.active { background: #4a7c59; box-shadow: 0 0 10px #4a7c59; }

.hidden { display: none !important; }
</style></head><body>
<aside class="sidebar">
    <div class="sidebar-brand">Studio</div>
    <nav class="nav-links">
        <button class="nav-tab active" data-tab="library" onclick="switchTab('library')"><i>&#128218;</i> <span>Library</span></button>
        <button class="nav-tab" data-tab="convert" onclick="switchTab('convert')"><i>&#128221;</i> <span>Production</span></button>
        <button class="nav-tab" data-tab="queue" onclick="switchTab('queue')"><i>&#8987;</i> <span>Queue</span></button>
        <button class="nav-tab" data-tab="voices" onclick="switchTab('voices')"><i>&#128483;</i> <span>Voices</span></button>
        <button class="nav-tab" data-tab="history" onclick="switchTab('history')"><i>&#128466;</i> <span>Archive</span></button>
        <button class="nav-tab" data-tab="settings" onclick="switchTab('settings')"><i>&#9881;</i> <span>Config</span></button>
    </nav>
    <div style="margin-top: auto; padding-top: 24px; border-top: 1px solid rgba(255,255,255,0.1);">
        <div style="display: flex; align-items: center;"><span id="gpu-state-dot" class="gpu-dot"></span> <span id="gpu-state-label" style="font-size: 0.9rem; font-weight: 600;">GPU Offline</span></div>
    </div>
</aside>
<main class="app-main">
    <header class="top-bar">
        <h1 class="page-title" id="view-title">Library</h1>
        <div class="theme-selector">
            <button class="theme-btn" id="btn-light" onclick="setTheme('light')">&#9700;</button>
            <button class="theme-btn" id="btn-dark" onclick="setTheme('dark')">&#9701;</button>
        </div>
    </header>
    <div class="content-body">
        <div class="tab-panel active" id="tab-library">
            <div class="card">
                <input type="text" id="library-search" class="input-control" style="width: 100%; padding: 20px; margin-bottom: 40px; font-size: 1.1rem; border-radius: 16px; border: 2px solid var(--border);"
                       placeholder="Search collection..." oninput="renderLibrary()">
                <div id="library-grid" class="library-grid"></div>
            </div>
        </div>
        <div class="tab-panel" id="tab-convert">
            <div class="card">
                <h2 style="font-family: 'Lora', serif; font-size: 2.2rem; margin-top: 0;">New Production</h2>
                <div id="upload-area" style="border: 2px dashed var(--border); padding: 120px 40px; text-align: center; border-radius: 20px; cursor: pointer; background: var(--bg-element); margin: 40px 0;" onclick="document.getElementById('file-input').click()">
                    <div style="font-size: 6rem; margin-bottom: 32px;">&#128214;</div>
                    <h3>Drop manuscript here</h3>
                    <div id="file-name-display" style="margin-top: 24px; font-weight: 700; color: var(--accent);"></div>
                </div>
                <input type="file" id="file-input" class="hidden" onchange="handleFile(event)">
                
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 40px; margin-bottom: 40px;">
                    <select id="prod-voice" class="input-control">
                        <option value="en-GB-RyanNeural">Default Narrator: Ryan (British)</option>
                        {% for id, v in voices.items() %}<option value="{{ id }}">{{ v.name }} ({{ v.accent }})</option>{% endfor %}
                    </select>
                    <input type="number" id="prod-speed" class="input-control" step="0.1" value="1.0" placeholder="Speed (1.0)">
                </div>
                
                <button id="convert-btn" class="btn btn-primary" style="width: 100%; height: 80px; font-size: 1.3rem;" disabled onclick="startProduction()">Initialize Production Pipeline</button>
            </div>
        </div>
        <div class="tab-panel" id="tab-queue"><div id="queue-content"></div></div>
        <div class="tab-panel" id="tab-voices"><div class="card"><h2 style="margin-top:0; font-family: 'Lora', serif;">Narrator Profiles</h2><div id="voices-grid" class="voices-grid"></div></div></div>
        <div class="tab-panel" id="tab-history"><div id="history-content"></div></div>
        <div class="tab-panel" id="tab-settings"><div class="card">Infrastructure settings configuration.</div></div>
    </div>
</main>
<div id="preview-modal" class="modal-overlay hidden">
    <div class="modal-content">
        <button class="modal-close" onclick="closePreview()">&#10005;</button>
        <h2 id="preview-modal-title" style="font-family: 'Lora', serif; font-size: 2.2rem; margin: 0;">Manuscript Preview</h2>
        <div id="preview-text"></div>
    </div>
</div>
<audio id="preview-audio"></audio>
<script>const voices = {{ voices | tojson }};
    let libraryBooks = [];
    let selectedFile = null;

    function switchTab(tabId) {
        document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
        const target = document.getElementById('tab-' + tabId);
        const nav = document.querySelector('.nav-tab[data-tab="' + tabId + '"]');
        if(target) target.classList.add('active');
        if(nav) nav.classList.add('active');
        const titleEl = document.getElementById('view-title');
        if(titleEl) titleEl.textContent = tabId.charAt(0).toUpperCase() + tabId.slice(1);
        localStorage.setItem('audiobook-tab', tabId);
        if(tabId === 'library') loadLibrary();
        if(tabId === 'history') loadHistory();
        if(tabId === 'voices') renderVoices();
        if(tabId === 'queue') loadJobs();
    }

    function setTheme(theme) {
        if(theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
        else document.documentElement.removeAttribute('data-theme');
        localStorage.setItem('audiobook-theme', theme);
        document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
        const btn = document.getElementById('btn-' + theme);
        if(btn) btn.classList.add('active');
    }

    async function loadLibrary() {
        try {
            const resp = await fetch('/api/library');
            libraryBooks = await resp.json();
            renderLibrary();
        } catch(e) { console.error(e); }
    }

    function toggleConfig(bookId) {
        document.querySelectorAll('.options-drawer').forEach(d => {
            if(d.id !== 'config-' + bookId) d.classList.remove('active');
        });
        document.getElementById('config-' + bookId).classList.toggle('active');
    }

    function renderLibrary() {
        const grid = document.getElementById('library-grid');
        const query = (document.getElementById('library-search')?.value || '').toLowerCase();
        const filtered = libraryBooks.filter(b => b.title.toLowerCase().includes(query));
        
        grid.innerHTML = filtered.map(b => {
            const bookId = btoa(b.path).replace(/[^a-z0-9]/gi, '');
            const isDone = b.status === 'completed';
            const statusIcon = isDone ? '&#9989; Done' : '&#128400; Available';
            
            return `
                <div class="library-item">
                    <div class="status-banner ${isDone ? 'completed' : 'queued'}">${statusIcon}</div>
                    <div class="library-item-title">${escapeHtml(b.title)}</div>
                    <div class="library-item-meta"><span>${b.format.toUpperCase()}</span></div>
                    
                    <div style="margin-top: auto; display: flex; gap: 12px;">
                        <button class="btn" onclick="previewBook('${escapeHtml(b.path).replace(/'/g, "\\'")}')">&#128065; Preview</button>
                        <button class="btn btn-primary" style="flex: 1;" onclick="toggleConfig('${bookId}')">Production Options</button>
                    </div>

                    <div id="config-${bookId}" class="options-drawer">
                        <div style="display: grid; gap: 20px; margin-bottom: 24px;">
                            <div>
                                <label style="font-weight: 800; font-size: 0.75rem; text-transform: uppercase;">Narrator</label>
                                <select id="voice-${bookId}" class="input-control" onchange="updateEstimate('${bookId}', '${escapeHtml(b.path).replace(/'/g, "\\'")}')">
                                    <option value="en-GB-RyanNeural">Ryan (British Actor)</option>
                                    ${Object.entries(voices).map(([vid, v]) => `<option value="${vid}">${v.name} (${v.accent})</option>`).join('')}
                                </select>
                            </div>
                            <div style="display: flex; gap: 16px;">
                                <div style="flex: 1;"><label style="font-weight: 800; font-size: 0.75rem;">START CH.</label><input id="start-${bookId}" type="number" class="input-control"></div>
                                <div style="flex: 1;"><label style="font-weight: 800; font-size: 0.75rem;">END CH.</label><input id="end-${bookId}" type="number" class="input-control"></div>
                                <div style="width: 80px;"><label style="font-weight: 800; font-size: 0.75rem;">SPEED</label><input id="speed-${bookId}" type="number" step="0.1" value="1.0" class="input-control"></div>
                            </div>
                        </div>
                        <div id="est-${bookId}" style="font-size: 0.85rem; margin-bottom: 20px; font-weight: 700; color: var(--accent);"></div>
                        <button class="btn btn-primary" style="width: 100%; height: 60px;" onclick="convertWithSettings('${bookId}', '${escapeHtml(b.path).replace(/'/g, "\\'")}')">Initialize Production</button>
                    </div>
                </div>
            `;
        }).join('');
    }

    async function updateEstimate(bookId, path) {
        const voice = document.getElementById('voice-' + bookId).value;
        const estEl = document.getElementById('est-' + bookId);
        try {
            const resp = await fetch('/api/library/estimate_cost', { 
                method: 'POST', 
                headers: {'Content-Type': 'application/json'}, 
                body: JSON.stringify({ path, voice }) 
            });
            const data = await resp.json();
            estEl.textContent = `Estimated Cost: $${data.estimated_cost.toFixed(2)} | Estimated Time: ${data.eta_minutes}m`;
        } catch(e) { estEl.textContent = ''; }
    }

    async function convertWithSettings(bookId, path) {
        const voice = document.getElementById('voice-' + bookId).value;
        const start = document.getElementById('start-' + bookId).value;
        const end = document.getElementById('end-' + bookId).value;
        const speed = document.getElementById('speed-' + bookId).value;
        
        await fetch('/api/library/convert', { 
            method: 'POST', 
            headers: {'Content-Type': 'application/json'}, 
            body: JSON.stringify({ path, voice, start_chapter: start, end_chapter: end, tts_speed: speed }) 
        });
        switchTab('queue');
    }

    function renderVoices() {
        const grid = document.getElementById('voices-grid');
        if(!grid) return;
        grid.innerHTML = Object.entries(voices).map(([id, v]) => `
            <div class="voice-card">
                <div>
                    <span class="voice-engine-badge">${escapeHtml(v.engine)}</span>
                    <div class="voice-name">${escapeHtml(v.name)}</div>
                    <div style="font-size: 0.85rem; color: var(--text-secondary);">${escapeHtml(v.accent)} · ${escapeHtml(v.gender)}</div>
                </div>
                <button class="btn" onclick="playPreview('${id}')">▶</button>
            </div>
        `).join('');
    }

    function playPreview(voiceId) {
        const audio = document.getElementById('preview-audio');
        audio.src = '/api/preview/' + voiceId; 
        audio.load();
        audio.play().catch(e => console.error('Audio play failed:', e));
    }

    async function previewBook(path) {
        const modal = document.getElementById('preview-modal');
        const textEl = document.getElementById('preview-text');
        textEl.textContent = 'Scanning manuscript content...';
        modal.classList.remove('hidden');
        try {
            const resp = await fetch('/api/library/preview', { 
                method: 'POST', 
                headers: { 'Content-Type': 'application/json' }, 
                body: JSON.stringify({ path }) 
            });
            const data = await resp.json();
            textEl.textContent = data.preview || data.error;
        } catch(e) { textEl.textContent = 'Error loading preview.'; }
    }

    function closePreview() { document.getElementById('preview-modal').classList.add('hidden'); }

    function handleFile(e) {
        if(e.target.files.length) {
            selectedFile = e.target.files[0];
            document.getElementById('file-name-display').textContent = selectedFile.name;
            document.getElementById('convert-btn').disabled = false;
        }
    }

    async function startProduction() {
        const formData = new FormData();
        formData.append('file', selectedFile);
        formData.append('voice', document.getElementById('prod-voice').value);
        formData.append('tts_speed', document.getElementById('prod-speed').value);
        await fetch('/api/convert', { method: 'POST', body: formData });
        switchTab('queue');
    }

    async function loadHistory() {
        try {
            const resp = await fetch('/api/history');
            const jobs = await resp.json();
            const content = document.getElementById('history-content');
            if(!content) return;
            content.innerHTML = jobs.map(j => `
                <div class="card" style="display:flex; justify-content:space-between; align-items:center; padding: 24px 40px;">
                    <div style="font-family: 'Lora', serif; font-size: 1.3rem; font-weight: 700;">&#9989; ${escapeHtml(j.book_name)}</div>
                    <button class="btn" onclick="window.location.href='/api/jobs/${j.id}/download'">Download Master</button>
                </div>
            `).join('') || '<div class="card" style="text-align:center; padding: 64px;">Archive is empty.</div>';
        } catch(e) { console.error(e); }
    }

    async function loadJobs() {
        try {
            const resp = await fetch('/api/jobs');
            const jobs = await resp.json();
            const active = jobs.filter(j => j.status === 'queued' || j.status.includes('converting'));
            const queueContent = document.getElementById('queue-content');
            if(queueContent && active.length > 0) {
                queueContent.innerHTML = active.map(j => `
                    <div class="card">
                        <div class="status-banner ${j.status === 'queued' ? 'queued' : 'converting'}">${j.status.toUpperCase()}</div>
                        <div class="library-item-title">${escapeHtml(j.book_name)}</div>
                        <div class="progress-container"><div class="progress-fill" style="width: ${j.progress_percent}%"></div></div>
                        <div class="metrics-row">
                            <div class="metric-item">${j.progress_percent}% complete</div>
                            <div class="metric-item">ETA: ${j.eta_minutes || '?'}m</div>
                        </div>
                        ${j.error ? `<div style="color:var(--error); margin-top:12px; font-size:0.8rem;">${escapeHtml(j.error)}</div>` : ''}
                    </div>
                `).join('');
            } else if(queueContent) {
                queueContent.innerHTML = '<div class="card" style="text-align:center; padding: 100px;">Production queue is currently clear.</div>';
            }
            const badge = document.getElementById('queue-badge');
            if(badge) { badge.textContent = active.length; badge.classList.toggle('hidden', active.length === 0); }
        } catch(e) {}
    }

    async function loadGpuStatus() {
        try {
            const resp = await fetch('/api/gpu/status');
            const gpu = await resp.json();
            const label = document.getElementById('gpu-state-label');
            const dot = document.getElementById('gpu-state-dot');
            if(label) label.textContent = (gpu.state || 'Offline').toUpperCase();
            if(dot) dot.className = 'gpu-dot ' + (gpu.state || 'idle');
        } catch(e) {}
    }

    function escapeHtml(str) { if(!str) return ''; const div = document.createElement('div'); div.textContent = str; return div.innerHTML; }

    window.onload = () => {
        const theme = localStorage.getItem('audiobook-theme') || 'light'; setTheme(theme);
        const tab = localStorage.getItem('audiobook-tab') || 'library'; switchTab(tab);
        setInterval(loadJobs, 5000); setInterval(loadGpuStatus, 10000);
    };
</script></body></html>
