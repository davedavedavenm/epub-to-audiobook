<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Audiobook Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@700&family=Outfit:wght@400;600&display=swap" rel="stylesheet">
    <style>
:root {
    --bg-primary: #f8f7f4; --bg-card: #ffffff; --bg-sidebar: #121212; --bg-element: #f1efeb; --bg-hover: #e8e5e0;
    --accent: #c28e5e; --text-primary: #1a1a1a; --text-secondary: #6b665f; --text-on-dark: #fdfcf9;
    --border: #e8e4de; --success: #4a7c59; --error: #af4d4d; --warning: #d4a373;
    --font-display: 'Lora', serif; --font-ui: 'Outfit', sans-serif;
    --sidebar-width: 280px; --radius-lg: 24px; --radius-md: 12px; --radius-sm: 8px;
}
[data-theme="dark"] {
    --bg-primary: #0a0a0a; --bg-card: #141414; --bg-sidebar: #050505; --bg-element: #1f1f1f; --bg-hover: #2a2a2a;
    --text-primary: #f0f0f0; --text-secondary: #a0a0a0; --border: #262626;
}
* { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
body { font-family: var(--font-ui); background: var(--bg-primary); color: var(--text-primary); margin: 0; display: flex; height: 100vh; overflow: hidden; transition: 0.3s; }

.tab-panel { display: none; width: 100%; }
.tab-panel.active { display: block; }

.sidebar { width: var(--sidebar-width); background: var(--bg-sidebar); color: var(--text-on-dark); padding: 48px 24px; display: flex; flex-direction: column; position: fixed; left: 0; top: 0; bottom: 0; }
.sidebar-brand { margin-bottom: 64px; font-family: var(--font-display); font-size: 2rem; font-weight: 700; }
.nav-links { display: flex; flex-direction: column; gap: 12px; flex: 1; }
.nav-tab { background: transparent; border: none; color: rgba(255,255,255,0.4); padding: 14px 20px; border-radius: var(--radius-md); cursor: pointer; display: flex; align-items: center; gap: 16px; font-size: 1.05rem; text-align: left; transition: 0.2s; width: 100%; }
.nav-tab:hover { background: rgba(255,255,255,0.05); color: #fff; }
.nav-tab.active { background: var(--accent); color: #fff; }

.app-main { flex: 1; margin-left: var(--sidebar-width); display: flex; flex-direction: column; height: 100vh; overflow-y: auto; }
.top-bar { padding: 24px 48px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; background: var(--bg-primary); border-bottom: 1px solid var(--border); z-index: 100; backdrop-filter: blur(12px); }
.page-title { font-family: var(--font-display); font-size: 2.2rem; font-weight: 700; margin: 0; }
.theme-selector { display: flex; background: var(--bg-element); padding: 4px; border-radius: 40px; border: 1px solid var(--border); }
.theme-btn { width: 40px; height: 40px; border-radius: 50%; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; background: transparent; font-size: 1.3rem; }
.theme-btn.active { background: var(--bg-card); color: var(--accent); }

.content-body { padding: 48px; max-width: 1300px; width: 100%; margin: 0 auto; }
.card { background: var(--bg-card); border-radius: var(--radius-lg); border: 1px solid var(--border); padding: 40px; margin-bottom: 40px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); }
.library-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 24px; }
.library-item { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 28px; transition: 0.3s; display: flex; flex-direction: column; }
.library-item:hover { border-color: var(--accent); transform: translateY(-4px); }

.input-control, .btn { padding: 14px 18px; background: var(--bg-element); border: 1px solid var(--border); border-radius: var(--radius-md); color: var(--text-primary); font-family: var(--font-ui); font-size: 1rem; }
.btn { font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s; }
.btn-primary { background: var(--text-primary); color: #fff; border: none; }
.btn-primary:hover { background: var(--accent); }

.gpu-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 10px; background: #444; }
.gpu-dot.active { background: var(--success); }

.modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; z-index: 2000; }
.modal-content { background: var(--bg-card); width: 90%; max-width: 900px; max-height: 85vh; border-radius: var(--radius-lg); padding: 48px; position: relative; display: flex; flex-direction: column; }
.modal-close { position: absolute; top: 24px; right: 24px; background: transparent; border: none; font-size: 1.8rem; cursor: pointer; color: var(--text-secondary); }
#preview-content { overflow-y: auto; flex: 1; margin-top: 24px; font-family: var(--font-display); font-size: 1.15rem; line-height: 1.7; white-space: pre-wrap; }

.hidden { display: none !important; }
</style>
</head>
<body>
    
<aside class="sidebar">
    <div class="sidebar-brand"><span class="logo-text">Studio</span></div>
    <nav class="nav-links">
        <button class="nav-tab" data-tab="library" onclick="switchTab('library')"><i>📚</i> <span>Library</span></button>
        <button class="nav-tab" data-tab="convert" onclick="switchTab('convert')"><i>📝</i> <span>Production</span></button>
        <button class="nav-tab" data-tab="queue" onclick="switchTab('queue')"><i>⏳</i> <span>Queue</span></button>
        <button class="nav-tab" data-tab="voices" onclick="switchTab('voices')"><i>🗣️</i> <span>Voices</span></button>
        <button class="nav-tab" data-tab="history" onclick="switchTab('history')"><i>📋</i> <span>Archive</span></button>
        <button class="nav-tab" data-tab="settings" onclick="switchTab('settings')"><i>⚙️</i> <span>Config</span></button>
    </nav>
    <div class="sidebar-footer">
        <div style="display: flex; align-items: center;"><span id="gpu-state-dot" class="gpu-dot"></span> <span id="gpu-state-label">GPU Offline</span></div>
    </div>
</aside>
<main class="app-main">
    <header class="top-bar">
        <h1 class="page-title" id="view-title">Library</h1>
        <div class="theme-selector"><button class="theme-btn" id="btn-light" onclick="setTheme('light')">☀️</button><button class="theme-btn" id="btn-dark" onclick="setTheme('dark')">🌙</button></div>
    </header>
    <div class="content-body">
        <div class="tab-panel" id="tab-library">
            <div class="card">
                <div style="display: flex; gap: 20px; margin-bottom: 32px;">
                    <input type="text" id="library-search" class="input-control" placeholder="Search collection...">
                </div>
                <div id="library-grid" class="library-grid"></div>
            </div>
        </div>
        <div class="tab-panel" id="tab-convert">
            <div class="card">
                <form id="convert-form">
                    <div id="upload-area" style="border: 2px dashed var(--border); padding: 80px; text-align: center; border-radius: 20px; cursor: pointer;">
                        <div style="font-size: 4rem;">📖</div><h3>Drop manuscript here</h3>
                    </div>
                    <input type="file" id="file-input" class="hidden">
                    <button type="submit" id="convert-btn" class="btn btn-primary" style="margin-top: 32px; height: 60px; width: 100%;" disabled>Start Production</button>
                </form>
            </div>
        </div>
        <div class="tab-panel" id="tab-queue"><div class="card"><div id="queue-content"></div></div></div>
        <div class="tab-panel" id="tab-voices"><div class="card"><div id="kokoro-voices" class="library-grid"></div></div></div>
        <div class="tab-panel" id="tab-history"><div class="card"><div id="history-content"></div></div></div>
        <div class="tab-panel" id="tab-settings"><div class="card">Settings Panel Content</div></div>
    </div>
</main>
<div id="preview-modal" class="modal-overlay hidden"><div class="modal-content"><button class="modal-close" onclick="closePreview()">✕</button><div id="preview-content"></div></div></div>

    <script>
        const voices = {{ voices | tojson }};
        
        function switchTab(tabId) {
            console.log('Switching to', tabId);
            document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
            
            const target = document.getElementById('tab-' + tabId);
            const nav = document.querySelector('.nav-tab[data-tab="' + tabId + '"]');
            
            if(target) target.classList.add('active');
            if(nav) nav.classList.add('active');
            
            document.getElementById('view-title').textContent = tabId.charAt(0).toUpperCase() + tabId.slice(1);
            localStorage.setItem('audiobook-tab', tabId);
            
            if(tabId === 'library') loadLibrary();
            if(tabId === 'history') loadHistory();
            if(tabId === 'queue') loadJobs();
        }

        function setTheme(theme) {
            if(theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
            else document.documentElement.removeAttribute('data-theme');
            localStorage.setItem('audiobook-theme', theme);
            document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + theme).classList.add('active');
        }

        async function loadLibrary() {
            const resp = await fetch('/api/library');
            const books = await resp.json();
            document.getElementById('library-grid').innerHTML = books.map(b => `
                <div class="library-item">
                    <div class="library-item-title">${b.title}</div>
                    <div class="library-item-meta"><span>${b.format.toUpperCase()}</span></div>
                    <button class="btn" onclick="previewBook('${b.path}')">Preview</button>
                </div>
            `).join('');
        }

        async function loadHistory() {
            const resp = await fetch('/api/history');
            const jobs = await resp.json();
            document.getElementById('history-content').innerHTML = jobs.map(j => `<div class="library-item">✅ ${j.book_name}</div>`).join('') || 'No archive items';
        }

        async function loadJobs() {
            const resp = await fetch('/api/jobs');
            const jobs = await resp.json();
            const active = jobs.filter(j => j.status === 'queued' || j.status.includes('converting'));
            document.getElementById('queue-content').innerHTML = active.map(j => `<div>${j.book_name} - ${j.progress_percent}%</div>`).join('') || 'No active production';
        }

        async function loadGpuStatus() {
            try {
                const resp = await fetch('/api/gpu/status');
                const gpu = await resp.json();
                document.getElementById('gpu-state-label').textContent = gpu.state || 'Offline';
                document.getElementById('gpu-state-dot').className = 'gpu-dot ' + (gpu.state || 'idle');
            } catch(e) {}
        }

        function escapeHtml(str) { const div = document.createElement('div'); div.textContent = str; return div.innerHTML; }

        window.onload = () => {
            const tab = localStorage.getItem('audiobook-tab') || 'library';
            const theme = localStorage.getItem('audiobook-theme') || 'light';
            setTheme(theme);
            switchTab(tab);
            setInterval(loadGpuStatus, 10000);
        };
    </script>
</body>
</html>
