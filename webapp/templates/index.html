<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audiobook Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #fdfcf9;
            --bg-card: #ffffff;
            --bg-sidebar: #1a1a1a;
            --bg-element: #f5f3ef;
            --bg-hover: #ece9e2;
            --accent: #c28e5e;
            --text-primary: #1a1a1a;
            --text-secondary: #6b665f;
            --text-on-dark: #fdfcf9;
            --border: #e8e4de;
            --radius-lg: 24px;
            --radius-md: 12px;
            --sidebar-width: 280px;
        }
        [data-theme="dark"] {
            --bg-primary: #0f0f0f;
            --bg-card: #1a1a1a;
            --bg-sidebar: #080808;
            --bg-element: #262626;
            --bg-hover: #333333;
            --text-primary: #f5f5f5;
            --text-secondary: #a3a3a3;
            --border: #262626;
        }
        * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
        body { font-family: 'Outfit', sans-serif; background: var(--bg-primary); color: var(--text-primary); margin: 0; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: var(--sidebar-width); background: var(--bg-sidebar); color: var(--text-on-dark); padding: 40px 24px; display: flex; flex-direction: column; flex-shrink: 0; }
        .nav-links { display: flex; flex-direction: column; gap: 8px; flex: 1; margin-top: 40px; }
        .nav-tab { background: transparent; border: none; color: rgba(255,255,255,0.5); padding: 14px 18px; border-radius: 12px; cursor: pointer; display: flex; align-items: center; gap: 16px; font-size: 1rem; transition: all 0.2s; text-align: left; }
        .nav-tab:hover { background: rgba(255,255,255,0.05); color: #fff; }
        .nav-tab.active { background: var(--accent); color: #fff; }
        .app-main { flex: 1; display: flex; flex-direction: column; overflow-y: auto; position: relative; }
        .top-bar { padding: 24px 40px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; background: rgba(253, 252, 249, 0.8); backdrop-filter: blur(10px); z-index: 100; }
        .content-body { padding: 0 40px 60px; max-width: 1200px; width: 100%; margin: 0 auto; }
        .card { background: var(--bg-card); border-radius: var(--radius-lg); border: 1px solid var(--border); padding: 32px; margin-bottom: 32px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); }
        .tab-panel { display: none; }
        .tab-panel.active { display: block; }
        .hidden { display: none !important; }
        .status-badge { padding: 4px 12px; border-radius: 12px; font-size: 0.8rem; font-weight: 600; }
        .status-badge.done { background: var(--success); color: white; }
        .library-item { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 12px; }
        .config-btn-group { display: flex; gap: 8px; }
        .option-select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-element); }
        .convert-btn { background: var(--text-primary); color: white; border: none; padding: 14px; border-radius: 8px; cursor: pointer; font-weight: 600; width: 100%; }
        .convert-btn:hover { background: var(--accent); }
    </style>
</head>
<body>
    <aside class="sidebar">
        <h1 style="font-family: 'Lora', serif; font-size: 1.8rem; margin: 0;">Studio</h1>
        <nav class="nav-links">
            <button class="nav-tab active" data-tab="convert"><i>📝</i> <span>Convert</span></button>
            <button class="nav-tab" data-tab="queue"><i>⏳</i> <span>Queue</span></button>
            <button class="nav-tab" data-tab="library"><i>📚</i> <span>Library</span></button>
            <button class="nav-tab" data-tab="voices"><i>🗣️</i> <span>Voices</span></button>
            <button class="nav-tab" data-tab="history"><i>📋</i> <span>History</span></button>
            <button class="nav-tab" data-tab="settings"><i>⚙️</i> <span>Settings</span></button>
        </nav>
    </aside>
    <main class="app-main">
        <header class="top-bar">
            <h2 id="view-title" style="font-family: 'Lora', serif; margin: 0;">Convert</h2>
        </header>
        <div class="content-body">
            <div class="tab-panel active" id="tab-convert">
                <div class="card">
                    <form id="convert-form">
                        <div id="upload-area" style="border: 2px dashed var(--border); padding: 40px; text-align: center; border-radius: 12px; cursor: pointer;">
                            <div style="font-size: 2rem;">📖</div>
                            <p id="file-name-display">Click or drag file to start</p>
                        </div>
                        <input type="file" id="file-input" class="hidden">
                        <div style="margin-top: 24px;">
                            <label class="option-label">Voice</label>
                            <select id="voice-select-simple" class="option-select">
                                <optgroup label="Kokoro">
                                    {% for voice_id, voice in voices.items() if voice.engine == 'kokoro' %}
                                    <option value="{{ voice_id }}">{{ voice.name }}</option>
                                    {% endfor %}
                                </optgroup>
                                <optgroup label="Edge">
                                    {% for voice_id, voice in voices.items() if voice.engine == 'edge' %}
                                    <option value="{{ voice_id }}">{{ voice.name }}</option>
                                    {% endfor %}
                                </optgroup>
                            </select>
                        </div>
                        <button type="submit" id="convert-btn" class="convert-btn" style="margin-top: 24px;" disabled>Start Production</button>
                        <input type="hidden" id="selected-voice" name="voice" value="bf_emma">
                    </form>
                </div>
            </div>
            <div class="tab-panel" id="tab-queue"><div id="queue-content"></div></div>
            <div class="tab-panel" id="tab-library"><div id="library-grid"></div></div>
            <div class="tab-panel" id="tab-voices"><div id="kokoro-voices"></div></div>
            <div class="tab-panel" id="tab-history"><div id="history-content"></div></div>
            <div class="tab-panel" id="tab-settings"><div id="settings-content"></div></div>
        </div>
    </main>
    <audio id="preview-audio"></audio>
    <script>
        const voices = {{ voices | tojson }};
        let selectedFile = null;
        let selectedVoice = 'bf_emma';

        function switchTab(tabId) {
            document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
            document.querySelector(`.nav-tab[data-tab="${tabId}"]`)?.classList.add('active');
            document.getElementById(`tab-${tabId}`)?.classList.add('active');
            document.getElementById('view-title').textContent = tabId.charAt(0).toUpperCase() + tabId.slice(1);
            localStorage.setItem('audiobook-tab', tabId);
            if (tabId === 'queue') loadJobs();
            if (tabId === 'library') loadLibrary();
            if (tabId === 'history') loadHistory();
        }

        document.querySelectorAll('.nav-tab').forEach(tab => {
            tab.addEventListener('click', () => switchTab(tab.dataset.tab));
        });

        const savedTab = localStorage.getItem('audiobook-tab') || 'convert';
        switchTab(savedTab);

        const uploadArea = document.getElementById('upload-area');
        const fileInput = document.getElementById('file-input');
        uploadArea.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length) {
                selectedFile = e.target.files[0];
                document.getElementById('file-name-display').textContent = selectedFile.name;
                document.getElementById('convert-btn').disabled = false;
            }
        });

        document.getElementById('voice-select-simple').addEventListener('change', (e) => {
            selectedVoice = e.target.value;
            document.getElementById('selected-voice').value = selectedVoice;
        });

        document.getElementById('convert-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData();
            formData.append('file', selectedFile);
            formData.append('voice', selectedVoice);
            try {
                const resp = await fetch('/api/convert', { method: 'POST', body: formData });
                if (resp.ok) switchTab('queue');
            } catch (err) { alert(err.message); }
        });

        async function loadJobs() {
            const resp = await fetch('/api/jobs');
            const jobs = await resp.json();
            const active = jobs.filter(j => j.status === 'queued' || j.status.includes('converting'));
            document.getElementById('queue-content').innerHTML = active.map(j => `
                <div class="library-item"><div>${j.book_name}</div><div>${j.status} - ${j.progress_percent || 0}%</div></div>
            `).join('') || 'No active jobs';
        }

        async function loadLibrary() {
            const resp = await fetch('/api/library');
            const books = await resp.json();
            document.getElementById('library-grid').innerHTML = books.map(b => `
                <div class="library-item">
                    <div style="display:flex; justify-content:space-between;">
                        <div>${b.title}</div>
                        <button class="convert-btn" style="width:auto; padding:4px 12px;" onclick="convertFromLibrary('${b.path}')">Convert</button>
                    </div>
                </div>
            `).join('');
        }

        async function convertFromLibrary(path) {
            try {
                const resp = await fetch('/api/library/convert', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ path, voice: selectedVoice })
                });
                if (resp.ok) switchTab('queue');
            } catch (err) { alert(err.message); }
        }

        async function loadHistory() {
            const resp = await fetch('/api/history');
            const jobs = await resp.json();
            document.getElementById('history-content').innerHTML = jobs.map(j => `
                <div class="library-item"><div>✅ ${j.book_name}</div><div>${j.completed_at}</div></div>
            `).join('') || 'No history';
        }

        setInterval(loadJobs, 10000);
        function escapeHtml(str) { const div = document.createElement('div'); div.textContent = str; return div.innerHTML; }
    </script>
</body>
</html>
