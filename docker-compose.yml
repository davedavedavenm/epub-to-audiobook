# EPUB/PDF to Audiobook Stack
# - Kokoro-FastAPI: TTS engine at http://localhost:8880
# - Piper TTS: Fast local TTS at http://localhost:5000 (optional)
# - Web UI: Upload and convert at http://localhost:8881

services:
  kokoro-tts:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    container_name: kokoro-tts
    ports:
      - "8880:8880"
    restart: unless-stopped
    volumes:
      - kokoro-cache:/app/cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8880/v1/audio/voices"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Optional: capture exact text sent to TTS (chunk-by-chunk) without modifying the converter image
  tts-proxy:
    build:
      context: ./tts_proxy
    container_name: tts-proxy
    restart: unless-stopped
    environment:
      - TTS_UPSTREAM_BASE=http://kokoro-tts:8880/v1
      - TRANSCRIPTS_DIR=/data/transcripts
    volumes:
      - ${STACK_PATH:-/home/dave/ai/lab/stacks/epub-to-audiobook}/data/transcripts:/data/transcripts
    depends_on:
      kokoro-tts:
        condition: service_healthy
    ports:
      - "8882:8882"

  # Piper TTS with OpenAI-compatible API
  # Uses openedai-speech as a wrapper for Piper
  piper-tts:
    image: ${PIPER_IMAGE:-ghcr.io/matatonic/openedai-speech-min:latest}
    container_name: piper-tts
    ports:
      - "5000:8000"
    restart: unless-stopped
    environment:
      - TTS_HOME=/data
      - HF_HOME=/data
    volumes:
      - piper-data:/data
    profiles:
      - piper  # Only start with: docker compose --profile piper up

  webapp:
    build:
      context: ./webapp
      args:
        APP_VERSION: ${APP_VERSION:-dev}
        APP_GIT_SHA: ${APP_GIT_SHA:-unknown}
        APP_BUILD_TIME: ${APP_BUILD_TIME:-unknown}
    container_name: epub-to-audiobook-ui
    extra_hosts:
      - "docker-vm:192.168.1.113"
    ports:
      - "8881:8881"
    restart: unless-stopped
    environment:
      - KOKORO_URL=http://kokoro-tts:8880/v1
      # If set (e.g. http://tts-proxy:8882), conversion containers will send TTS requests via the proxy
      - TTS_PROXY_URL=${TTS_PROXY_URL:-}
      - PIPER_URL=http://piper-tts:8000/v1
      - UPLOAD_DIR=/data/uploads
      - OUTPUT_DIR=/data/audiobooks
      - PREVIEWS_DIR=/data/previews
      - DB_PATH=/data/jobs.db
      - APP_VERSION=${APP_VERSION:-dev}
      - APP_GIT_SHA=${APP_GIT_SHA:-unknown}
      - APP_BUILD_TIME=${APP_BUILD_TIME:-unknown}
      - STACK_PATH=${STACK_PATH:-/home/dave/ai/lab/stacks/epub-to-audiobook}
      # IMPORTANT: This must match the absolute path used in volumes below
      - HOST_STACK_DIR=${STACK_PATH:-/home/dave/ai/lab/stacks/epub-to-audiobook}
      - AUDIOBOOKSHELF_DIR=${AUDIOBOOKSHELF_DIR:-/opt/stacks/audiobookshelf/audiobooks}
      - AUDIOBOOKSHELF_HOST=${AUDIOBOOKSHELF_HOST:-docker-vm}
      - AUDIOBOOKSHELF_USER=${AUDIOBOOKSHELF_USER:-dave}
      - AUDIOBOOKSHELF_PORT=${AUDIOBOOKSHELF_PORT:-}
      - LIBRARY_DIR=${LIBRARY_DIR:-/mnt/openbooks}
      - EVOLUTION_API_URL=${EVOLUTION_API_URL:-}
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY:-}
      - DEFAULT_WHATSAPP_NUMBER=${DEFAULT_WHATSAPP_NUMBER:-}
      - HEALTH_KOKORO_TIMEOUT=${HEALTH_KOKORO_TIMEOUT:-8}
      - HEALTH_KOKORO_RETRIES=${HEALTH_KOKORO_RETRIES:-2}
      - LOG_DIR=${LOG_DIR:-/data/logs}
      - QUEUE_RUNNER_ENABLED=0
    volumes:
      # Use ABSOLUTE paths so it works regardless of where docker compose is run from
      - ${STACK_PATH:-/home/dave/ai/lab/stacks/epub-to-audiobook}/data/uploads:/data/uploads
      - ${STACK_PATH:-/home/dave/ai/lab/stacks/epub-to-audiobook}/data/audiobooks:/data/audiobooks
      - ${STACK_PATH:-/home/dave/ai/lab/stacks/epub-to-audiobook}/data/previews:/data/previews
      - ${STACK_PATH:-/home/dave/ai/lab/stacks/epub-to-audiobook}/data:/data
      - /var/run/docker.sock:/var/run/docker.sock
      # SSH key for rsync to docker-vm
      - ${STACK_PATH:-/home/dave/ai/lab/stacks/epub-to-audiobook}/ssh-keys/id_ed25519:/root/.ssh/id_ed25519:ro
      - ${STACK_PATH:-/home/dave/ai/lab/stacks/epub-to-audiobook}/ssh-keys/config:/root/.ssh/config:ro
      # OpenBooks library for browsing available EPUBs
      - ${LIBRARY_DIR:-/mnt/openbooks}:${LIBRARY_DIR:-/mnt/openbooks}:ro
    depends_on:
      kokoro-tts:
        condition: service_healthy

  worker:
    build:
      context: ./webapp
      args:
        APP_VERSION: ${APP_VERSION:-dev}
        APP_GIT_SHA: ${APP_GIT_SHA:-unknown}
        APP_BUILD_TIME: ${APP_BUILD_TIME:-unknown}
    container_name: epub-to-audiobook-worker
    extra_hosts:
      - "docker-vm:192.168.1.113"
    restart: unless-stopped
    environment:
      - KOKORO_URL=http://kokoro-tts:8880/v1
      - TTS_PROXY_URL=${TTS_PROXY_URL:-}
      - PIPER_URL=http://piper-tts:8000/v1
      - UPLOAD_DIR=/data/uploads
      - OUTPUT_DIR=/data/audiobooks
      - PREVIEWS_DIR=/data/previews
      - DB_PATH=/data/jobs.db
      - APP_VERSION=${APP_VERSION:-dev}
      - APP_GIT_SHA=${APP_GIT_SHA:-unknown}
      - APP_BUILD_TIME=${APP_BUILD_TIME:-unknown}
      - STACK_PATH=${STACK_PATH:-/home/dave/ai/lab/stacks/epub-to-audiobook}
      - HOST_STACK_DIR=${STACK_PATH:-/home/dave/ai/lab/stacks/epub-to-audiobook}
      - AUDIOBOOKSHELF_DIR=${AUDIOBOOKSHELF_DIR:-/opt/stacks/audiobookshelf/audiobooks}
      - AUDIOBOOKSHELF_HOST=${AUDIOBOOKSHELF_HOST:-docker-vm}
      - AUDIOBOOKSHELF_USER=${AUDIOBOOKSHELF_USER:-dave}
      - AUDIOBOOKSHELF_PORT=${AUDIOBOOKSHELF_PORT:-}
      - LIBRARY_DIR=${LIBRARY_DIR:-/mnt/openbooks}
      - EVOLUTION_API_URL=${EVOLUTION_API_URL:-}
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY:-}
      - DEFAULT_WHATSAPP_NUMBER=${DEFAULT_WHATSAPP_NUMBER:-}
      - HEALTH_KOKORO_TIMEOUT=${HEALTH_KOKORO_TIMEOUT:-8}
      - HEALTH_KOKORO_RETRIES=${HEALTH_KOKORO_RETRIES:-2}
      - LOG_DIR=${LOG_DIR:-/data/logs}
      - QUEUE_RUNNER_ENABLED=1
    volumes:
      - ${STACK_PATH:-/home/dave/ai/lab/stacks/epub-to-audiobook}/data/uploads:/data/uploads
      - ${STACK_PATH:-/home/dave/ai/lab/stacks/epub-to-audiobook}/data/audiobooks:/data/audiobooks
      - ${STACK_PATH:-/home/dave/ai/lab/stacks/epub-to-audiobook}/data/previews:/data/previews
      - ${STACK_PATH:-/home/dave/ai/lab/stacks/epub-to-audiobook}/data:/data
      - /var/run/docker.sock:/var/run/docker.sock
      - ${STACK_PATH:-/home/dave/ai/lab/stacks/epub-to-audiobook}/ssh-keys/id_ed25519:/root/.ssh/id_ed25519:ro
      - ${STACK_PATH:-/home/dave/ai/lab/stacks/epub-to-audiobook}/ssh-keys/config:/root/.ssh/config:ro
      - ${LIBRARY_DIR:-/mnt/openbooks}:${LIBRARY_DIR:-/mnt/openbooks}:ro
    depends_on:
      kokoro-tts:
        condition: service_healthy
    command: ["python", "/app/worker.py"]

  # Optional: sampled ASR verification ("does the audio match the book text?")
  # Not started by default; the webapp can run this as a one-off container via docker.sock.
  audio-verify:
    build:
      context: ./audio_verify
    image: epub-to-audiobook-audio-verify:local
    profiles:
      - verify

volumes:
  kokoro-cache:
  piper-data:
