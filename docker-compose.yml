# EPUB/PDF to Audiobook Stack
# - Kokoro-FastAPI: TTS engine at http://localhost:8880
# - Piper TTS: Fast local TTS at http://localhost:5000 (optional)
# - Web UI: Upload and convert at http://localhost:8881

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: docker-socket-proxy
    logging: *default-logging
    restart: unless-stopped
    environment:
      - CONTAINERS=1
      - IMAGES=1
      - POST=1
      - GET=1
      - NETWORKS=1
      - VOLUMES=1
      - PLUGINS=0
      - SWARM=0
      - NODES=0
      - TASKS=0
      - SECRETS=0
      - CONFIGS=0
      - AUTH=0
      - BUILD=0
      - COMMIT=0
      - DISTRIBUTION=0
      - EVENTS=0
      - EXEC=0
      - PING=1
      - VERSION=1
      - SYSTEM=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - dockersock

  kokoro-tts:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:v0.2.2
    container_name: kokoro-tts
    logging: *default-logging
    ports:
      - "8880:8880"
    restart: unless-stopped
    # Memory limit: Kokoro leaks ~1GB per chapter; cap at 10GB so Docker
    # restarts it cleanly before OOM-killing the entire host.
    mem_limit: 10g
    memswap_limit: 10g
    volumes:
      - kokoro-cache:/app/cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8880/v1/audio/voices"]
      interval: 60s
      timeout: 30s
      retries: 10
      start_period: 300s

  # Optional: capture exact text sent to TTS (chunk-by-chunk) without modifying the converter image
  tts-proxy:
    build:
      context: ./tts_proxy
    container_name: tts-proxy
    logging: *default-logging
    restart: unless-stopped
    environment:
      - TTS_UPSTREAM_BASE=http://kokoro-tts:8880/v1
      - TRANSCRIPTS_DIR=/data/transcripts
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - INWORLD_API_KEY=${INWORLD_API_KEY:-}
      - DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY:-}
    volumes:
      - ${STACK_PATH:-/opt/epub-to-audiobook}/data/transcripts:/data/transcripts
      - ${STACK_PATH:-/opt/epub-to-audiobook}/data:/data
    depends_on:
      kokoro-tts:
        condition: service_started
    expose:
      - "8882"

  # Chatterbox Turbo — high-quality voice-cloning TTS with UK narrator voices.
  # CPU by default (works everywhere). Start with: docker compose --profile chatterbox up
  chatterbox-tts:
    image: ghcr.io/davedavedavenm/epub-to-audiobook-chatterbox:latest
    build:
      context: ./chatterbox
    container_name: chatterbox-tts
    logging: *default-logging
    ports:
      - "8004:8004"
    restart: unless-stopped
    # Cap memory so a runaway generation restarts THIS container cleanly
    # instead of the kernel OOM-killing arbitrary processes (2026-07-07).
    mem_limit: 6g
    memswap_limit: 6g
    environment:
      - CHATTERBOX_CHUNK_CHARS=${CHATTERBOX_CHUNK_CHARS:-280}
      - NUMBA_CACHE_DIR=/tmp/numba
    volumes:
      - chatterbox-cache:/data/hf
      # Custom cloned voices, uploaded through the UI. Overlaid on top of the
      # voices baked into the image, so a new reference WAV is usable without
      # a rebuild — the server rescans the directory when it meets an unknown
      # voice id.
      - ${STACK_PATH:-/opt/epub-to-audiobook}/data/voices:/app/voices/custom
    profiles:
      - chatterbox
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 180s

  # Chatterbox Nano — same image, but CHATTERBOX_NANO=1 loads the 110M Nano
  # model instead of Turbo. A container loads Turbo XOR Nano at startup, so
  # Nano needs its own service to run alongside Turbo. Start with:
  #   docker compose --profile chatterbox-nano up
  chatterbox-nano:
    image: ghcr.io/davedavedavenm/epub-to-audiobook-chatterbox:latest
    build:
      context: ./chatterbox
    container_name: chatterbox-nano
    logging: *default-logging
    ports:
      - "8006:8004"
    restart: unless-stopped
    mem_limit: 6g
    memswap_limit: 6g
    environment:
      - CHATTERBOX_NANO=1
      - CHATTERBOX_CHUNK_CHARS=${CHATTERBOX_CHUNK_CHARS:-280}
      - NUMBA_CACHE_DIR=/tmp/numba
    volumes:
      - chatterbox-cache:/data/hf
      # Custom cloned voices, uploaded through the UI. Overlaid on top of the
      # voices baked into the image, so a new reference WAV is usable without
      # a rebuild — the server rescans the directory when it meets an unknown
      # voice id.
      - ${STACK_PATH:-/opt/epub-to-audiobook}/data/voices:/app/voices/custom
    profiles:
      - chatterbox-nano
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 180s

  # Chatterbox Multilingual V3 — isolated accent-preservation candidate.
  # It shares code and model cache with the other Chatterbox variants but loads
  # the 500M multilingual checkpoint in its own process. Evaluation only until
  # Irish and South African references have been graded by ear.
  chatterbox-v3:
    image: ghcr.io/davedavedavenm/epub-to-audiobook-chatterbox:latest
    build:
      context: ./chatterbox
    container_name: chatterbox-v3
    logging: *default-logging
    ports:
      - "8009:8004"
    restart: unless-stopped
    # V3 loads under 8 GiB but its S3Gen decode crosses that cap after token
    # generation; the first real render was cgroup-killed at that exact point.
    mem_limit: 12g
    memswap_limit: 12g
    environment:
      - CHATTERBOX_MULTILINGUAL_V3=1
      - CHATTERBOX_CHUNK_CHARS=${CHATTERBOX_CHUNK_CHARS:-280}
      # Official same-language default. cfg=0 is upstream's mitigation for a
      # reference/target LANGUAGE mismatch, not a general accent-strength knob.
      - CHATTERBOX_CFG_WEIGHT=${CHATTERBOX_V3_CFG_WEIGHT:-0.5}
      - NUMBA_CACHE_DIR=/tmp/numba
    volumes:
      - chatterbox-cache:/data/hf
      - ${STACK_PATH:-/opt/epub-to-audiobook}/data/voices:/app/voices/custom
    profiles:
      - chatterbox-v3
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 300s

  # Hume TADA — most natural voice-cloning engine (British narrators).
  # CPU by default. Start with: docker compose --profile tada up
  tada-tts:
    image: ghcr.io/davedavedavenm/epub-to-audiobook-tada:latest
    build:
      context: ./tada
    container_name: tada-tts
    logging: *default-logging
    ports:
      - "8005:8005"
    restart: unless-stopped
    # Measured 2026-07-27 on zorin: bf16 peaks at exactly 10.00 GiB — it
    # survives the old 10g cap but with zero headroom, i.e. it is reclaiming at
    # the ceiling rather than sitting comfortably. The cap is the CONTAINER's
    # limit, not the host's: zorin has 31 GB with ~21 GB available, and this is
    # transient (idle RSS is ~487 MiB — the model loads lazily on first
    # request). Raising the cap therefore costs nothing when idle and removes
    # the cliff where a slightly longer chunk gets OOM-killed mid-render.
    mem_limit: 14g
    memswap_limit: 14g
    environment:
      - TADA_CHUNK_CHARS=${TADA_CHUNK_CHARS:-600}
      # f32 doubles weights to ~16 GB and will not fit the cap — see #23.
      - TADA_CPU_DTYPE=${TADA_CPU_DTYPE:-bf16}
      - HF_TOKEN=${HF_TOKEN:-}
    volumes:
      - tada-cache:/data/hf
    profiles:
      - tada
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 600s

  # MeloTTS — small, CPU-realtime English model with native British,
  # Australian and Indian speaker embeddings. Evaluation-only until the
  # rendered samples have passed listening and ASR checks.
  melotts-tts:
    build:
      context: ./melotts
    container_name: melotts-tts
    logging: *default-logging
    ports:
      - "8007:8007"
    restart: unless-stopped
    mem_limit: 4g
    memswap_limit: 4g
    environment:
      - NUMBA_CACHE_DIR=/tmp/numba
    volumes:
      - melotts-cache:/data
    profiles:
      - melotts
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8007/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # OmniVoice — local voice design with explicit British/Australian/Indian
  # accents. CPU float32 is slower but avoids relying on unsupported fp16 CPU
  # kernels; its non-commercial model licence makes this evaluation-only.
  omnivoice-tts:
    build:
      context: ./omnivoice
    container_name: omnivoice-tts
    logging: *default-logging
    ports:
      - "8008:8008"
    restart: unless-stopped
    mem_limit: 12g
    memswap_limit: 12g
    environment:
      - OMNIVOICE_DEVICE=cpu
      - OMNIVOICE_DTYPE=${OMNIVOICE_DTYPE:-float32}
      - OMNIVOICE_THREADS=${OMNIVOICE_THREADS:-6}
      - OMNIVOICE_NUM_STEP=${OMNIVOICE_NUM_STEP:-32}
    volumes:
      - omnivoice-cache:/data/hf
    profiles:
      - omnivoice
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8008/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # VibeVoice 1.5B — cfg 2.0 won the pinned long-form listening test. GPU-only and opt-in;
  # the default Zorin stack remains local/free Chatterbox Nano. Full-book use
  # normally targets free Kaggle. This service is for an explicitly available
  # local CUDA host and never provisions or rents a GPU.
  vibevoice-tts:
    build:
      context: .
      dockerfile: ./vibevoice/Dockerfile
    container_name: vibevoice-tts
    logging: *default-logging
    ports:
      - "8010:8010"
    restart: unless-stopped
    environment:
      - VIBEVOICE_MODEL=${VIBEVOICE_MODEL:-microsoft/VibeVoice-1.5B}
      - VIBEVOICE_DTYPE=${VIBEVOICE_DTYPE:-float16}
      - VIBEVOICE_CFG_SCALE=${VIBEVOICE_CFG_SCALE:-2.0}
      - VIBEVOICE_DDPM_STEPS=${VIBEVOICE_DDPM_STEPS:-10}
    volumes:
      - vibevoice-cache:/data/hf
      - ${STACK_PATH:-/opt/epub-to-audiobook}/data/voices:/app/voices/custom
    profiles:
      - vibevoice
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8010/health"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 300s

  # Qwen3-TTS 1.7B Base — consistency co-finalist/fallback. Same explicit,
  # GPU-only boundary as VibeVoice; no Vast provisioning is connected to it.
  qwen3-tts:
    build:
      context: .
      dockerfile: ./qwen3/Dockerfile
    container_name: qwen3-tts
    logging: *default-logging
    ports:
      - "8011:8011"
    restart: unless-stopped
    environment:
      - QWEN3_MODEL=${QWEN3_MODEL:-Qwen/Qwen3-TTS-12Hz-1.7B-Base}
      - QWEN3_DTYPE=${QWEN3_DTYPE:-float16}
    volumes:
      - qwen3-cache:/data/hf
      - ${STACK_PATH:-/opt/epub-to-audiobook}/data/voices:/app/voices/custom
    profiles:
      - qwen3
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8011/health"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 300s

  # Pocket TTS 2.1 — free, local, CPU-only candidate. Peter Yearsley and the
  # explicit number/currency input profile passed the short listening screen;
  # this remains opt-in until a full-book gate is heard. All 21 official
  # English presets are exposed and cached before the UI offers Play.
  pocket-tts:
    build:
      context: ./pocket
    container_name: pocket-tts
    logging: *default-logging
    ports:
      - "8012:8012"
    restart: unless-stopped
    # Keep two cores free on the six-core production host so a long render
    # cannot starve the UI/worker. Override deliberately on a different host.
    cpus: ${POCKET_CPUS:-4.0}
    mem_limit: 4g
    memswap_limit: 4g
    environment:
      - CUDA_VISIBLE_DEVICES=
      - POCKET_THREADS=${POCKET_THREADS:-4}
    volumes:
      - pocket-cache:/data/hf
    profiles:
      - pocket
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8012/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

  # KittenTTS 0.8.1 — free, local, CPU-only developer-preview candidate.
  # Jasper and Rosie passed the normalized-input short screen; no preset is a
  # production default until its long-form output is heard.
  kitten-tts:
    build:
      context: ./kitten
    container_name: kitten-tts
    logging: *default-logging
    ports:
      - "8013:8013"
    restart: unless-stopped
    cpus: ${KITTEN_CPUS:-4.0}
    mem_limit: 4g
    memswap_limit: 4g
    environment:
      - CUDA_VISIBLE_DEVICES=
      - OMP_NUM_THREADS=${KITTEN_THREADS:-4}
      - MKL_NUM_THREADS=${KITTEN_THREADS:-4}
      - KITTEN_THREADS=${KITTEN_THREADS:-4}
    volumes:
      - kitten-cache:/data/hf
    profiles:
      - kitten
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8013/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

  # Gemini 3.1 Flash TTS through the Gemini Developer API FREE tier only.
  # This adapter has no Vertex endpoint, paid model, batch route, or retry
  # loop. Use a key from a dedicated project whose AI Studio plan says Free.
  # Quota exhaustion stops the job; it never falls back to a paid service.
  gemini-tts:
    build:
      context: ./gemini
    container_name: gemini-tts
    logging: *default-logging
    restart: unless-stopped
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_FREE_PROJECT_ID=${GEMINI_FREE_PROJECT_ID:-}
      - GEMINI_FREE_PROJECT_CONFIRMED=${GEMINI_FREE_PROJECT_CONFIRMED:-0}
      - GEMINI_REQUEST_TIMEOUT=${GEMINI_REQUEST_TIMEOUT:-300}
      - GEMINI_TTS_STYLE=${GEMINI_TTS_STYLE:-}
      - GEMINI_USAGE_DIR=/data/gemini_usage
      - GEMINI_USAGE_BOOTSTRAP_PACIFIC_DATE=${GEMINI_USAGE_BOOTSTRAP_PACIFIC_DATE:-}
      - GEMINI_USAGE_BOOTSTRAP_COUNT=${GEMINI_USAGE_BOOTSTRAP_COUNT:-0}
    volumes:
      - gemini-usage:/data/gemini_usage
    profiles:
      - gemini
    expose:
      - "8014"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8014/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  webapp:
    build:
      context: .
      dockerfile: ./webapp/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}
        APP_GIT_SHA: ${APP_GIT_SHA:-unknown}
        APP_BUILD_TIME: ${APP_BUILD_TIME:-unknown}
    container_name: epub-to-audiobook-ui
    logging: *default-logging
    extra_hosts:
      - "docker-vm:${DOCKER_VM_IP:-127.0.0.1}"
    ports:
      - "8881:8881"
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      # LAN access is intentionally passwordless. The public hostname is
      # protected by Pangolin SSO; do not stack HTTP Basic behind it.
      - APP_TRUSTED_HOSTS=${APP_TRUSTED_HOSTS:-}
      - KOKORO_URL=${KOKORO_URL:-http://kokoro-tts:8880/v1}
      # If set (e.g. http://tts-proxy:8882), conversion containers will send TTS requests via the proxy
      - TTS_PROXY_URL=${TTS_PROXY_URL:-}
      - CHATTERBOX_URL=${CHATTERBOX_URL:-http://chatterbox-tts:8004/v1}
      - CHATTERBOX_NANO_URL=${CHATTERBOX_NANO_URL:-http://chatterbox-nano:8004/v1}
      - TADA_URL=${TADA_URL:-http://tada-tts:8005/v1}
      - VIBEVOICE_URL=${VIBEVOICE_URL:-http://vibevoice-tts:8010/v1}
      - QWEN3_URL=${QWEN3_URL:-http://qwen3-tts:8011/v1}
      - POCKET_URL=${POCKET_URL:-http://pocket-tts:8012/v1}
      - KITTEN_URL=${KITTEN_URL:-http://kitten-tts:8013/v1}
      - GEMINI_TTS_URL=${GEMINI_TTS_URL:-http://gemini-tts:8014/v1}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_TTS_STYLE=${GEMINI_TTS_STYLE:-}
      - GEMINI_FREE_PROJECT_ID=${GEMINI_FREE_PROJECT_ID:-}
      - GEMINI_FREE_PROJECT_CONFIRMED=${GEMINI_FREE_PROJECT_CONFIRMED:-0}
      - ENABLE_GEMINI_PROFILE=${ENABLE_GEMINI_PROFILE:-0}
      - DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY:-}
      - OPENBOOKS_WS_URL=${OPENBOOKS_WS_URL:-ws://192.168.1.113:6082/ws}
      - UPLOAD_DIR=/data/uploads
      - LIBRARY_DIR=${LIBRARY_DIR:-/mnt/openbooks}
      - OUTPUT_DIR=/data/audiobooks
      - PREVIEWS_DIR=/data/previews
      - DB_PATH=/data/jobs.db
      - APP_VERSION=${APP_VERSION:-dev}
      - APP_GIT_SHA=${APP_GIT_SHA:-unknown}
      - APP_BUILD_TIME=${APP_BUILD_TIME:-unknown}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-}
      - STACK_PATH=${STACK_PATH:-/opt/epub-to-audiobook}
      # IMPORTANT: This must match the absolute path used in volumes below
      - HOST_STACK_DIR=${STACK_PATH:-/opt/epub-to-audiobook}
      - AUDIOBOOKSHELF_DIR=${AUDIOBOOKSHELF_DIR:-/opt/stacks/audiobookshelf/audiobooks}
      - AUDIOBOOKSHELF_HOST=${AUDIOBOOKSHELF_HOST:-docker-vm}
      - AUDIOBOOKSHELF_USER=${AUDIOBOOKSHELF_USER:-dave}
      - AUDIOBOOKSHELF_PORT=${AUDIOBOOKSHELF_PORT:-}
      - EVOLUTION_API_URL=${EVOLUTION_API_URL:-}
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY:-}
      - DEFAULT_WHATSAPP_NUMBER=${DEFAULT_WHATSAPP_NUMBER:-}
      - HEALTH_KOKORO_TIMEOUT=${HEALTH_KOKORO_TIMEOUT:-8}
      - HEALTH_KOKORO_RETRIES=${HEALTH_KOKORO_RETRIES:-2}
      - LOG_DIR=${LOG_DIR:-/data/logs}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - TELEGRAM_WEBHOOK_SECRET=${TELEGRAM_WEBHOOK_SECRET:-}
      - ABS_API_TOKEN=${ABS_API_TOKEN:-}
      - ABS_API_URL=${ABS_API_URL:-http://docker-vm:13378}
      - DOCKER_HOST=tcp://docker-socket-proxy:2375
      - QUEUE_RUNNER_ENABLED=0
      # Kaggle: webapp reads the shared quota state + creds for the settings test
      - KAGGLE_API_TOKEN=${KAGGLE_API_TOKEN:-}
      - KAGGLE_USERNAME=${KAGGLE_USERNAME:-}
      - KAGGLE_RENDER_STATE=/data/kaggle_render_state.json
      # LLM (OpenAI-compatible): powers the smart chapter guard + adaptive
      # pronunciation. Optional — without a key the app uses a deterministic
      # heuristic. Free options: Groq (fast, recommended) or Gemini. Can also be
      # set in the Settings UI instead of here.
      - LLM_API_BASE_URL=${LLM_API_BASE_URL:-https://api.openai.com/v1}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL_NAME=${LLM_MODEL_NAME:-gpt-4o-mini}
      # Local Ollama (e.g. a shared box) for background guard jobs (pre-sync
      # quality gate diagnosis). Optional — the gate decision is deterministic;
      # this only phrases the human explanation.
      - OLLAMA_URL=${OLLAMA_URL:-}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:7b}
      # Per-call LLM ceiling. MUST stay below PREPARE_GRACE_MINUTES or a slow
      # endpoint stalls preprocessing past the watchdog and loops the render.
      - LLM_TIMEOUT_SECONDS=${LLM_TIMEOUT_SECONDS:-60}
      - PREPARE_GRACE_MINUTES=${PREPARE_GRACE_MINUTES:-15}
      # Voice-sample pre-caching: ON by default so every voice previews
      # instantly. The throttle (waits for low load, pauses between voices)
      # plus per-engine mem_limits make it safe; the 2026-07-18 OOM incident
      # that made it opt-in predates the 2026-07-20 box upgrade (i5-12400 /
      # 31 GB). Set VOICE_CACHE_ON_START=0 to disable on a smaller host.
      - VOICE_CACHE_ON_START=${VOICE_CACHE_ON_START:-1}
      - VOICE_CACHE_MAX_LOAD=${VOICE_CACHE_MAX_LOAD:-}
      - VOICE_CACHE_DELAY=${VOICE_CACHE_DELAY:-5}
      # Manual paid-GPU status display (queue-driven autoscaling is retired)
      - AUTOSCALE_COST_CAP=${AUTOSCALE_COST_CAP:-1.00}
    mem_limit: 2g
    memswap_limit: 2g
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8881/api/health"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 30s
    volumes:
      # Use ABSOLUTE paths so it works regardless of where docker compose is run from
      - ${STACK_PATH:-/opt/epub-to-audiobook}/data/uploads:/data/uploads
      - ${STACK_PATH:-/opt/epub-to-audiobook}/data/audiobooks:/data/audiobooks
      - ${STACK_PATH:-/opt/epub-to-audiobook}/data/previews:/data/previews
      - ${STACK_PATH:-/opt/epub-to-audiobook}/data:/data
      - ${STACK_PATH:-/opt/epub-to-audiobook}/ssh-keys/id_ed25519:/home/appuser/.ssh/id_ed25519:ro
      - ${STACK_PATH:-/opt/epub-to-audiobook}/ssh-keys/config:/home/appuser/.ssh/config:ro
      # OpenBooks library for browsing available EPUBs
      - ${LIBRARY_DIR:-/mnt/openbooks}:${LIBRARY_DIR:-/mnt/openbooks}:ro
    networks:
      - default
      - dockersock
    depends_on:
      kokoro-tts:
        condition: service_healthy
      docker-socket-proxy:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: ./webapp/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}
        APP_GIT_SHA: ${APP_GIT_SHA:-unknown}
        APP_BUILD_TIME: ${APP_BUILD_TIME:-unknown}
    container_name: epub-to-audiobook-worker
    logging: *default-logging
    extra_hosts:
      - "docker-vm:${DOCKER_VM_IP:-127.0.0.1}"
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - KOKORO_URL=${KOKORO_URL:-http://kokoro-tts:8880/v1}
      - TTS_PROXY_URL=${TTS_PROXY_URL:-}
      - CHATTERBOX_URL=${CHATTERBOX_URL:-http://chatterbox-tts:8004/v1}
      - CHATTERBOX_NANO_URL=${CHATTERBOX_NANO_URL:-http://chatterbox-nano:8004/v1}
      - TADA_URL=${TADA_URL:-http://tada-tts:8005/v1}
      - VIBEVOICE_URL=${VIBEVOICE_URL:-http://vibevoice-tts:8010/v1}
      - QWEN3_URL=${QWEN3_URL:-http://qwen3-tts:8011/v1}
      - POCKET_URL=${POCKET_URL:-http://pocket-tts:8012/v1}
      - KITTEN_URL=${KITTEN_URL:-http://kitten-tts:8013/v1}
      - GEMINI_TTS_URL=${GEMINI_TTS_URL:-http://gemini-tts:8014/v1}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_TTS_STYLE=${GEMINI_TTS_STYLE:-}
      - GEMINI_FREE_PROJECT_ID=${GEMINI_FREE_PROJECT_ID:-}
      - GEMINI_FREE_PROJECT_CONFIRMED=${GEMINI_FREE_PROJECT_CONFIRMED:-0}
      - ENABLE_GEMINI_PROFILE=${ENABLE_GEMINI_PROFILE:-0}
      - DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY:-}
      - UPLOAD_DIR=/data/uploads
      - LIBRARY_DIR=${LIBRARY_DIR:-/mnt/openbooks}
      - OUTPUT_DIR=/data/audiobooks
      - PREVIEWS_DIR=/data/previews
      - DB_PATH=/data/jobs.db
      - APP_VERSION=${APP_VERSION:-dev}
      - APP_GIT_SHA=${APP_GIT_SHA:-unknown}
      - APP_BUILD_TIME=${APP_BUILD_TIME:-unknown}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-}
      - STACK_PATH=${STACK_PATH:-/opt/epub-to-audiobook}
      - HOST_STACK_DIR=${STACK_PATH:-/opt/epub-to-audiobook}
      - AUDIOBOOKSHELF_DIR=${AUDIOBOOKSHELF_DIR:-/opt/stacks/audiobookshelf/audiobooks}
      - AUDIOBOOKSHELF_HOST=${AUDIOBOOKSHELF_HOST:-docker-vm}
      - AUDIOBOOKSHELF_USER=${AUDIOBOOKSHELF_USER:-dave}
      - AUDIOBOOKSHELF_PORT=${AUDIOBOOKSHELF_PORT:-}
      - EVOLUTION_API_URL=${EVOLUTION_API_URL:-}
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY:-}
      - DEFAULT_WHATSAPP_NUMBER=${DEFAULT_WHATSAPP_NUMBER:-}
      - HEALTH_KOKORO_TIMEOUT=${HEALTH_KOKORO_TIMEOUT:-8}
      - HEALTH_KOKORO_RETRIES=${HEALTH_KOKORO_RETRIES:-2}
      - LOG_DIR=${LOG_DIR:-/data/logs}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - ABS_API_TOKEN=${ABS_API_TOKEN:-}
      - ABS_API_URL=${ABS_API_URL:-http://docker-vm:13378}
      - DOCKER_HOST=tcp://docker-socket-proxy:2375
      - QUEUE_RUNNER_ENABLED=1
      - MAX_CONCURRENT_JOBS=${MAX_CONCURRENT_JOBS:-1}
      # Legacy manual Vast manager. Queue-driven paid provisioning is retired.
      - AUTOSCALE_COST_CAP=${AUTOSCALE_COST_CAP:-1.00}
      - GPU_IDLE_TIMEOUT=${GPU_IDLE_TIMEOUT:-10}
      - VASTAI_TEMPLATE_HASH=${VASTAI_TEMPLATE_HASH:-e2588a22cf5eef43df3d444ef4f25705}
      - VASTAI_CLI=vastai
      - VASTAI_SSH_KEY=/home/appuser/.ssh/vastai_ed25519
      - HOST_VASTAI_SSH_KEY=/home/dave/.ssh/vastai_ed25519
      - VASTAI_API_KEY_FILE=/home/appuser/.config/vastai/vast_api_key
      # Free Kaggle GPU render (per-book "Render on: Kaggle GPU")
      - KAGGLE_API_TOKEN=${KAGGLE_API_TOKEN:-}
      - KAGGLE_USERNAME=${KAGGLE_USERNAME:-}
      - KAGGLE_KERNELS_DIR=/app/kaggle_kernels
      # LLM (OpenAI-compatible): smart chapter guard + adaptive pronunciation.
      # Optional — heuristic fallback if unset. Free: Groq / Gemini.
      - LLM_API_BASE_URL=${LLM_API_BASE_URL:-https://api.openai.com/v1}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL_NAME=${LLM_MODEL_NAME:-gpt-4o-mini}
      # Local Ollama for the pre-sync quality-gate diagnosis (optional, background)
      - OLLAMA_URL=${OLLAMA_URL:-}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:7b}
      # Per-call LLM ceiling. MUST stay below PREPARE_GRACE_MINUTES or a slow
      # endpoint stalls preprocessing past the watchdog and loops the render.
      - LLM_TIMEOUT_SECONDS=${LLM_TIMEOUT_SECONDS:-60}
      - PREPARE_GRACE_MINUTES=${PREPARE_GRACE_MINUTES:-15}
      # Shared GPU-hours state (webapp reads for the quota readout, worker writes)
      - KAGGLE_RENDER_STATE=/data/kaggle_render_state.json
    volumes:
      - ${STACK_PATH:-/opt/epub-to-audiobook}/data/uploads:/data/uploads
      - ${STACK_PATH:-/opt/epub-to-audiobook}/data/audiobooks:/data/audiobooks
      - ${STACK_PATH:-/opt/epub-to-audiobook}/data/previews:/data/previews
      - ${STACK_PATH:-/opt/epub-to-audiobook}/data:/data
      - ${STACK_PATH:-/opt/epub-to-audiobook}/ssh-keys/id_ed25519:/home/appuser/.ssh/id_ed25519:ro
      - ${STACK_PATH:-/opt/epub-to-audiobook}/ssh-keys/config:/home/appuser/.ssh/config:ro
      - ${LIBRARY_DIR:-/mnt/openbooks}:${LIBRARY_DIR:-/mnt/openbooks}:ro
      # Kaggle GPU render: kernel templates (credentials come from env)
      - ${STACK_PATH:-/opt/epub-to-audiobook}/scripts/kaggle:/app/kaggle_kernels:ro
      - /home/dave/.ssh/vastai_ed25519:/home/appuser/.ssh/vastai_ed25519:ro
      - ${VASTAI_API_KEY_PATH:-/home/dave/.config/vastai/vast_api_key}:/home/appuser/.config/vastai/vast_api_key:ro
    networks:
      - default
      - dockersock
    mem_limit: 4g
    memswap_limit: 4g
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'worker.py' || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      kokoro-tts:
        condition: service_healthy
      docker-socket-proxy:
        condition: service_started
    command: ["python", "/app/worker.py"]

  # Optional: sampled ASR verification ("does the audio match the book text?")
  # Not started by default; the webapp can run this as a one-off container via docker.sock.
  audio-verify:
    build:
      context: ./audio_verify
    image: epub-to-audiobook-audio-verify:local
    profiles:
      - verify

networks:
  default:
  dockersock:
    internal: true

volumes:
  kokoro-cache:
  chatterbox-cache:
  tada-cache:
  melotts-cache:
  omnivoice-cache:
  vibevoice-cache:
  qwen3-cache:
  pocket-cache:
  kitten-cache:
  gemini-usage:
