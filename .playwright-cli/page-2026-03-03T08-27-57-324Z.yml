- generic [ref=e1]:
  - text: ".engine-section { margin-bottom: 64px; } .engine-header { font-family: 'Lora', serif; font-size: 1.4rem; font-weight: 800; letter-spacing: 0.1em; color: var(--accent); margin-bottom: 32px; border-bottom: 1px solid var(--border); padding-bottom: 16px; display: flex; align-items: center; gap: 16px; } .engine-header::after { content: ''; flex: 1; height: 1px; background: var(--border); opacity: 0.5; } .voices-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 24px; } .voice-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 24px; transition: 0.3s; display: flex; justify-content: space-between; align-items: center; } .voice-card:hover { border-color: var(--accent); transform: translateY(-4px); box-shadow: 0 12px 30px -10px rgba(0,0,0,0.1); } .voice-name { font-family: 'Lora', serif; font-size: 1.2rem; font-weight: 700; margin-bottom: 4px; } .voice-meta { font-size: 0.85rem; color: var(--text-secondary); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; } .preview-btn { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; cursor: pointer; background: var(--bg-element); transition: 0.2s; color: var(--text-primary); } .preview-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }"
