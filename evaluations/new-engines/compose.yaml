services:
  audio8:
    build:
      context: ../..
      dockerfile: evaluations/new-engines/audio8.Dockerfile
    cpus: 4
    mem_limit: 6g
    memswap_limit: 6g
    environment:
      - CUDA_VISIBLE_DEVICES=
      - HF_HOME=/cache/huggingface
      - OMP_NUM_THREADS=4
      - MKL_NUM_THREADS=4
    volumes:
      - ../..:/repo:ro
      - ./output:/output
      - audio8-models:/models
      - audio8-hf:/cache/huggingface

  scylla:
    build:
      context: ../..
      dockerfile: evaluations/new-engines/scylla.Dockerfile
    cpus: 4
    mem_limit: 8g
    memswap_limit: 8g
    environment:
      - CUDA_VISIBLE_DEVICES=
      - HF_HOME=/cache/huggingface
      - OMP_NUM_THREADS=4
      - MKL_NUM_THREADS=4
      - OPENBLAS_NUM_THREADS=4
    volumes:
      - ../..:/repo:ro
      - ./output:/output
      - scylla-models:/models
      - scylla-hf:/cache/huggingface

  zonos2:
    build:
      context: ../..
      dockerfile: evaluations/new-engines/zonos2.Dockerfile
    cpus: 4
    mem_limit: 20g
    memswap_limit: 20g
    environment:
      - CUDA_VISIBLE_DEVICES=
      - HF_HOME=/cache/huggingface
      - OMP_NUM_THREADS=4
      - GGML_NUM_THREADS=4
    volumes:
      - ../..:/repo:ro
      - ./output:/output
      - zonos2-models:/models
      - zonos2-hf:/cache/huggingface

  loudkit:
    build:
      context: ../..
      dockerfile: evaluations/new-engines/loudkit.Dockerfile
    cpus: 4
    mem_limit: 10g
    memswap_limit: 10g
    environment:
      - CUDA_VISIBLE_DEVICES=
      - HF_HOME=/cache/huggingface
      - OMP_NUM_THREADS=4
      - MKL_NUM_THREADS=4
    volumes:
      - ../..:/repo:ro
      - ./output:/output
      - loudkit-models:/models
      - loudkit-hf:/cache/huggingface

  sopro:
    build:
      context: ../..
      dockerfile: evaluations/new-engines/sopro.Dockerfile
    cpus: 4
    mem_limit: 6g
    memswap_limit: 6g
    environment:
      - CUDA_VISIBLE_DEVICES=
      - HF_HOME=/cache/huggingface
      - OMP_NUM_THREADS=4
      - MKL_NUM_THREADS=4
    volumes:
      - ../..:/repo:ro
      - ./output:/output
      - sopro-models:/models
      - sopro-hf:/cache/huggingface

volumes:
  audio8-models:
  audio8-hf:
  scylla-models:
  scylla-hf:
  zonos2-models:
  zonos2-hf:
  loudkit-models:
  loudkit-hf:
  sopro-models:
  sopro-hf:
